<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#B01F2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="INOURAR">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js?v=0.18.3"></script>
<title>INOURAR — Architecture</title>
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('inourar_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="fonts.css?v=0.18.3">
<style>
:root{
  --crimson:#B01F2E; --crimson-d:#7A1220; --crimson-t:#B01F2E;
  --orange:#F27B2B; --orange-d:#D4561C; --gold:#F2B33D;
  --ink:#21171A; --ink2:#4A3F3B; --muted:#85736C;
  --bg:#F8F3EE; --bg2:#F1E8E0;
  --card:rgba(255,255,255,.84); --card-solid:#FFFFFF; --input:#FFFFFF;
  --line:rgba(120,70,50,.13); --line2:#DDD3CC; --soft:#F3EAE3; --hover:#FBF5F0; --th:#FAF3EC;
  --green:#17A085; --danger:#B3261E;
  --orbg:#FDE8D7; --crbg:#FADDE0; --grbg:#DDF3EC; --warnbg:#FFF1D6; --warnc:#8A5A00; --okbg:#E3F3E6; --okc:#1E6B34;
  --side:linear-gradient(180deg,#2A1519 0%,#1A0F12 100%);
  --topbar:rgba(248,243,238,.86); --loader:rgba(248,243,238,.94);
  --sk1:#EFE8E1; --sk2:#F8F3EE;
  --shape:rgba(176,31,46,.07); --shape2:rgba(242,123,43,.11); --gridc:rgba(120,70,50,.07);
  --ease:cubic-bezier(.2,.7,.2,1);
  --shadow:0 10px 30px rgba(110,40,30,.09);
  --font:'Expo Arabic',system-ui,Tahoma,sans-serif;
  color-scheme:light;
}
html[data-theme="dark"]{
  --crimson-t:#F0586A;
  --ink:#F6ECE8; --ink2:#D9C9C2; --muted:#A8938B;
  --bg:#120C0E; --bg2:#1B1013;
  --card:rgba(36,24,27,.80); --card-solid:#241A1D; --input:#1E1518;
  --line:rgba(255,235,225,.10); --line2:rgba(255,235,225,.2); --soft:#2B1D21; --hover:#2A1D21; --th:#2A1D21;
  --green:#2FC9A6; --danger:#FF6B5E;
  --orbg:rgba(255,138,61,.16); --crbg:rgba(224,54,74,.18); --grbg:rgba(47,201,166,.15); --warnbg:rgba(245,190,85,.16); --warnc:#F5BE55; --okbg:rgba(47,201,166,.15); --okc:#2FC9A6;
  --side:linear-gradient(180deg,#1A0E11 0%,#0E080A 100%);
  --topbar:rgba(18,12,14,.82); --loader:rgba(18,12,14,.94);
  --sk1:#241A1D; --sk2:#2F2226;
  --shape:rgba(224,54,74,.10); --shape2:rgba(255,138,61,.09); --gridc:rgba(255,235,225,.05);
  --shadow:0 12px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:radial-gradient(1200px 640px at 100% 0,var(--bg2),var(--bg));background-attachment:fixed;color:var(--ink);min-height:100vh;line-height:1.7;animation:fadeIn .35s ease both;transition:background-color .3s ease,color .3s ease}
.bg-shapes{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.screen{position:relative;z-index:1}
.muted{color:var(--muted);font-size:14px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.screen{min-height:100vh}
#bootView{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
.boot-logo{width:64px}
.boot-spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin .9s linear infinite}

/* ---------- الدخول ---------- */
#loginView{display:flex;flex-wrap:wrap;min-height:100vh}
.login-form-side{flex:1 1 440px;min-width:0;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.login-box{width:100%;max-width:410px;display:flex;flex-direction:column;gap:22px;animation:fadeUp .6s var(--ease) both}
.login-top{display:flex;align-items:center;gap:12px}
.logo-tile{width:52px;height:52px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 52px}
.logo-tile .logo-mark{width:32px}
.login-top .nm{display:flex;flex-direction:column;line-height:1.3}
.login-top .nm b{font-size:18px;letter-spacing:.5px}
.login-box h1{font-size:32px;font-weight:800;line-height:1.3;letter-spacing:-.3px}
.login-box h1 i{color:var(--orange);font-style:normal}
.login-box .lead{color:var(--muted);font-size:15px}
.login-box form{display:flex;flex-direction:column;gap:16px}
.login-note{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.login-brand-side{flex:1.1 1 460px;min-width:0;position:relative;overflow:hidden;background:linear-gradient(155deg,var(--crimson) 0%,var(--crimson-d) 55%,#3D0A10 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:48px 36px;animation:fadeIn .8s ease both}
.login-brand-side::before{content:"";position:absolute;width:480px;height:480px;border-radius:50%;background:rgba(242,123,43,.26);inset-inline-end:-150px;top:-160px}
.login-brand-side::after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;border:2px solid rgba(255,255,255,.12);inset-inline-start:-110px;bottom:-110px}
.lockup-card{position:relative;width:min(330px,72%);background:#fff;border-radius:30px;padding:26px;box-shadow:0 30px 70px rgba(0,0,0,.35);animation:pop .7s .15s var(--ease) both}
.lockup-card .logo-lockup{width:100%}
.login-brand-side h2{position:relative;font-size:24px;font-weight:800;line-height:1.6;text-align:center;max-width:430px}
.login-brand-side p{position:relative;font-size:15px;color:rgba(255,255,255,.82);text-align:center;max-width:430px;line-height:1.9}
@media (max-width:860px){.login-brand-side{display:none}}

.card{backdrop-filter:blur(8px);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.login-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.login-card h1{font-size:20px;font-weight:700;text-align:center}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
input,select{font:inherit;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--input);color:var(--ink);transition:border-color .18s ease,box-shadow .18s ease}
input:focus,select:focus{outline:0;border-color:var(--crimson);box-shadow:0 0 0 4px rgba(158,28,39,.10)}
.form-error{color:var(--danger);font-size:14px;background:var(--crbg);border-radius:10px;padding:8px 12px;animation:fadeUp .25s var(--ease) both}

.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;transition:transform .15s ease,background .18s ease,box-shadow .2s ease,filter .2s ease}
.btn:disabled{opacity:.6;cursor:default}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:active:not(:disabled),.pill:active,button.module:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(270deg,var(--crimson),#7E141D);color:#fff;box-shadow:0 6px 16px rgba(158,28,39,.25)}
.btn-primary:hover:not(:disabled){box-shadow:0 10px 22px rgba(158,28,39,.32)}
.btn-ghost{background:var(--card-solid);color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:hover:not(:disabled){background:var(--hover);border-color:var(--line2)}
.btn-sm{padding:5px 12px;font-size:13px;margin-inline-start:6px;border-radius:10px}
.btn.is-busy{position:relative;color:transparent}
.btn.is-busy::after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}

/* ---------- الهيكل: شريط جانبي + محتوى ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{flex:0 0 264px;width:264px;background:var(--side);color:#E9E2DD;display:flex;flex-direction:column;gap:6px;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;z-index:80;animation:slideIn .45s var(--ease) both}
.side-brand{display:flex;align-items:center;gap:12px;padding:6px 8px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.side-brand .logo-tile{border:0}
.side-name{font-weight:800;font-size:17px;letter-spacing:.5px;color:#fff;display:block;line-height:1.3}
.side-sub{font-size:12px;color:#B9AEA8;display:block}
.side-nav{display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font:inherit;font-size:15px;color:#D8CFC9;background:transparent;border:0;cursor:pointer;text-align:start;width:100%;transition:background .18s ease,transform .18s ease,color .18s ease}
.nav-item:hover:not(.off){background:rgba(255,255,255,.08)}
.nav-item.on{background:linear-gradient(270deg,var(--orange),var(--orange-d));color:#fff;font-weight:700;box-shadow:0 6px 16px rgba(201,80,31,.3)}
.nav-item.off{opacity:.45;cursor:default}
.nav-item svg{flex:0 0 20px}
.nav-item .soon{margin-inline-start:auto;font-size:11px;background:rgba(255,255,255,.1);padding:1px 8px;border-radius:99px}
.nav-item:focus-visible,.icon-btn:focus-visible,.btn:focus-visible,.pill:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.side-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:rgba(255,255,255,.06)}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--crimson));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:0 0 40px}
.side-user-text{min-width:0;flex:1}
.side-user .name{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user .muted{color:#B9AEA8;font-size:12px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:0;background:rgba(255,255,255,.08);color:#E9E2DD;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .18s ease}
.icon-btn:hover{background:rgba(255,255,255,.16)}
.nav-scrim{display:none}

.shell-main{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;padding:14px 28px;background:var(--topbar);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:20px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .btn.menu-btn{display:none;background:var(--card-solid);color:var(--ink);border:1.5px solid var(--line)}
.topbar .btn{padding:9px 14px;display:inline-flex;align-items:center;gap:6px}
.side-user .icon-btn{flex:0 0 38px}
.refresh-btn .ri{display:inline-block}
.refresh-btn.spin .ri{animation:spin .7s linear infinite}

.content{width:100%;max-width:1180px;margin:0 auto;padding:26px 28px 44px}
.content h2{font-size:20px;margin-bottom:4px}
.static,.static *{animation:none!important}
.view-enter{animation:viewIn .28s var(--ease) both}
@media (max-width:900px){
  .sidebar{position:fixed;inset-block:0;inset-inline-start:0;transform:translateX(105%);transition:transform .3s var(--ease);animation:none;box-shadow:-10px 0 40px rgba(0,0,0,.35)}
  .sidebar.open{transform:none}
  .nav-scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;animation:fadeIn .2s ease both}
  .nav-scrim:not([hidden]){display:block}
  .topbar .btn.menu-btn{display:inline-flex}
  .topbar{padding:12px 16px;gap:8px}
  .topbar .lbl{display:none}
  .topbar .btn{padding:9px 11px}
  .topbar h1{font-size:17px}
  .content{padding:18px 16px 36px}
}

/* البحث السريع */
.kbd{font:inherit;font-size:11px;background:var(--soft);color:var(--muted);padding:1px 7px;border-radius:6px;margin-inline-start:6px}
@media (max-width:640px){.kbd{display:none}}
.overlay.pal{align-items:flex-start;padding-top:12vh}
.pal-card{background:var(--card-solid);width:100%;max-width:520px;padding:12px;display:flex;flex-direction:column;gap:8px;animation:pop .2s var(--ease) both}
.pal-card input{width:100%;font-size:16px}
.pal-list{list-style:none;max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.pal-list li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer}
.pal-list li.hot{background:var(--orbg)}
.pal-list li small{color:var(--muted)}
.pal-list li.none{cursor:default;color:var(--muted)}

/* ---------- لوحة القيادة ---------- */
.dash-head{display:flex;flex-direction:column;gap:2px;margin-bottom:20px}
.dash-head h2{font-size:27px;font-weight:800;letter-spacing:-.3px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:18px}
.kpi{backdrop-filter:blur(8px);box-shadow:var(--shadow);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;animation:pop .5s var(--ease) both;transition:transform .22s ease,box-shadow .22s ease}
.kpi:nth-child(2){animation-delay:.07s}.kpi:nth-child(3){animation-delay:.14s}.kpi:nth-child(4){animation-delay:.21s}
.kpi-top{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted)}
.kpi-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.kpi-v{display:flex;align-items:baseline;gap:6px}
.kpi-v b{font-size:30px;font-weight:800;direction:ltr;unicode-bidi:isolate;line-height:1.2}
.kpi-v small{font-size:13px;color:var(--muted)}
.kpi-note{font-size:12.5px;color:var(--muted)}
.kpi.hero{background:linear-gradient(135deg,var(--crimson),var(--crimson-d));color:#fff;border:0;box-shadow:0 14px 30px rgba(110,18,27,.25);position:relative;overflow:hidden}
.kpi.hero::after{content:"";z-index:0;position:absolute;inset-inline-start:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:rgba(224,108,39,.28)}
.kpi.hero .kpi-top,.kpi.hero .kpi-v small,.kpi.hero .kpi-note{color:rgba(255,255,255,.86);position:relative}
.kpi.hero .kpi-v,.kpi.hero .kpi-top,.kpi.hero .kpi-note{position:relative;z-index:1}
.table-wrap table{min-width:620px}
.c-orange{background:var(--orbg);color:var(--orange-d)}.c-red{background:var(--crbg);color:var(--crimson-t)}.c-green{background:var(--grbg);color:var(--green)}
.dash-grid{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:18px;align-items:stretch}
.dash-grid>.panel-card{flex:1 1 320px;min-width:0}
.dash-grid>.panel-card.wide{flex:2 1 460px}
.panel-card{backdrop-filter:blur(8px);box-shadow:var(--shadow);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;animation:fadeUp .55s .15s var(--ease) both}
.panel-card h3{font-size:17px;font-weight:800}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}
.chart{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;height:200px;padding:0 4px;border-bottom:1px solid var(--line)}
.chart .col{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:5px;height:100%}
.chart .bar{width:20px;min-height:2px;border-radius:6px 6px 0 0;transform-origin:bottom;animation:growY .8s .3s var(--ease) both}
.chart-x{display:flex;justify-content:space-between;gap:10px;padding:0 4px;font-size:12.5px;color:var(--muted);text-align:center}
.chart-x span{flex:1}
.alert-row{display:flex;gap:12px;padding:12px 14px;border-radius:14px;align-items:flex-start}
.alert-row .dot{width:9px;height:9px;border-radius:50%;margin-top:8px;flex:0 0 9px}
.alert-row b{display:block;font-size:14px}
.alert-row small{color:var(--muted);font-size:12.5px}
.alert-row .amt{margin-inline-start:auto;font-weight:700;font-size:13px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.alert-row.high{background:var(--crbg)}.alert-row.high .dot{background:var(--crimson)}
.alert-row.mid{background:var(--orbg)}.alert-row.mid .dot{background:var(--orange)}
.alert-row.low{background:var(--soft)}.alert-row.low .dot{background:var(--muted)}
.all-clear{display:flex;align-items:center;gap:10px;color:var(--green);font-weight:700;padding:14px;background:var(--grbg);border-radius:14px}
.prj-row{display:grid;grid-template-columns:2.2fr 1.2fr 1.5fr 1.5fr 1.7fr;gap:14px;padding:14px 6px;align-items:center;border-bottom:1px solid var(--line);cursor:pointer;transition:background .18s ease;background:transparent;border-inline:0;border-top:0;font:inherit;text-align:start;color:inherit;width:100%}
.prj-row:last-child{border-bottom:0}
.prj-row:hover:not(.head){background:var(--hover)}
.prj-row.head{cursor:default;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);padding-block:8px}
.prj-row .nm b{display:block;font-size:14.5px}
.prj-row .nm small{color:var(--muted);font-size:12px}
.prj-row .m{direction:ltr;unicode-bidi:isolate;text-align:start;font-size:13px;font-weight:700}
.prj-scroll{overflow-x:auto}
.prj-scroll>div{min-width:700px}
.prog{display:flex;align-items:center;gap:10px}
.prog .trk{flex:1;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog .fil{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--crimson));border-radius:99px;transform-origin:right center;animation:growX .9s .3s var(--ease) both}
.prog b{font-size:12.5px;direction:ltr}
.stage-badge{font-size:12px;font-weight:700;color:var(--orange-d);background:var(--orbg);padding:4px 12px;border-radius:99px;justify-self:start;white-space:nowrap}
.dash-skel{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.dash-skel .skel-row{height:120px;border-radius:20px}

/* ---------- القوائم والجداول (الشاشات الحالية) ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:20px}
.module{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0}
.toolbar input[type=search],.toolbar input[type=text]{min-width:200px;flex:1 1 200px}
.toolbar .spacer{flex:1}
.check{flex-direction:row;align-items:center;gap:6px;font-weight:400}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pill{font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--card-solid);border-radius:999px;padding:7px 16px;cursor:pointer;color:var(--ink);transition:all .18s ease}
.pill:hover{border-color:var(--orange)}
.pill.on{background:var(--crimson);border-color:var(--crimson);color:#fff;box-shadow:0 4px 12px rgba(158,28,39,.25)}
.table-wrap{overflow-x:auto;backdrop-filter:blur(8px);background:var(--card);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:start;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:700;background:var(--th);white-space:nowrap;color:var(--ink2);font-size:13px}
tbody tr{transition:background .15s ease}
tbody tr:hover{background:var(--hover)}
tr:last-child td{border-bottom:0}
tr.off td{opacity:.55}
td.actions{white-space:nowrap}
.empty{padding:24px;text-align:center;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.badge.warn{background:var(--warnbg);color:var(--warnc)}

      <button id="themeBtn" class="btn btn-ghost theme-btn" type="button" data-theme-toggle aria-label="تبديل الوضع" title="تبديل الوضع"></button>
      <button id="searchBtn" class="btn btn-ghost" type="button" title="بحث سريع (Ctrl K)" aria-label="بحث سريع"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lbl">بحث</span><kbd class="kbd">Ctrl K</kbd></button>
      <button id="refreshBtn" class="btn btn-ghost refresh-btn" type="button" title="تحديث الصفحة الحالية"><span class="ri" aria-hidden="true">↻</span><span class="lbl">تحديث</span></button>
    </header>

    <main id="homeView" class="content view-enter">
      <div id="homeBody"></div>
    </main>

    <main id="moduleView" class="content" hidden>
      <h2 id="moduleTitle" class="sr-only"></h2>
      <div id="moduleBody"></div>
    </main>
  </div>
</section>

<script>
(function () {
  'use strict';

  var TOKEN_KEY = 'inourar_token';
  var state = { token: null, user: null, roleLabel: '', build: '', refresh: null, module: null };
  var views = {};

  // الأقسام: العرض هنا للتنقل فقط. الصلاحية الحقيقية يفرضها الخادم في كل طلب.
  var MODULES = [
    { key: 'clients',   label: 'الزبائن',               roles: ['DG', 'RESP'] },
    { key: 'projects',  label: 'المشاريع',              roles: ['DG', 'RESP', 'ING'] },
    { key: 'finance',   label: 'المالية',               roles: ['DG', 'RESP'] },
    { key: 'caisses',   label: 'الصناديق والخزينة',     roles: ['DG', 'RESP', 'ING'] },
    { key: 'planning',  label: 'التخطيط',               roles: ['DG', 'RESP', 'ING'] },
    { key: 'personnel', label: 'الموظفون والصلاحيات',   roles: ['DG', 'RESP'] },
    { key: 'settings',  label: 'الإعدادات',             roles: ['DG', 'RESP'] },
    { key: 'portal',    label: 'مشاريعي ودفعاتي',       roles: ['CLIENT'] },
    { key: 'audit',     label: 'سجل النشاط',            roles: ['DG'] },
    { key: 'guide',     label: 'دليل الاستعمال',        roles: ['DG', 'RESP', 'ING', 'CLIENT'] }
  ];

  function $(id) { return document.getElementById(id); }

  /* ---------- أدوات الواجهة ---------- */

  // ينشئ عنصر DOM بأمان (النص دائمًا textContent، فلا حقن HTML)
  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'value') el.value = v;
        else if (k === 'checked') el.checked = !!v;
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      });
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return el;
  }

  function field(labelText, input) { return h('label', {}, [labelText, input]); }

  function toast(msg, kind, ms) {
    var t = h('div', { class: 'toast' + (kind === 'error' ? ' err' : kind === 'big' ? ' big' : kind === 'ok' ? ' ok' : ''), text: msg });
    $('toastBox').appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, ms || 3500);
  }

  // نافذة منبثقة. onSubmit يعيد Promise (أو لا شيء): النجاح يغلقها، والخطأ يظهر داخلها.
  // onSaveNew (اختياري): زر «حفظ وإضافة آخر» لا يغلق النافذة (Ctrl+Enter يشغّله).
  // Enter ينقل إلى الخانة التالية، وفي آخر خانة يحفظ.
  function modal(opts) {
    var overlay = h('div', { class: 'overlay' });
    var downOnOverlay = false;
    overlay.addEventListener('mousedown', function (e) { downOnOverlay = (e.target === overlay); });
    overlay.addEventListener('click', function (e) {          // النقر خارج النافذة يغلقها (ما لم يكن الحفظ جاريًا)
      if (e.target === overlay && downOnOverlay && !submit.disabled) close();
    });
    var err = h('div', { class: 'form-error', role: 'alert', hidden: true });
    var submit = h('button', { class: 'btn btn-primary', type: 'submit', text: opts.submitLabel || 'حفظ' });
    var cancel = h('button', { class: 'btn btn-ghost', type: 'button', text: 'إلغاء', onclick: close });
    var saveNew = opts.onSaveNew ? h('button', { class: 'btn btn-ghost', type: 'button', text: 'حفظ وإضافة آخر', onclick: doSaveNew }) : null;
    var form = h('form', { class: 'card modal' }, [
      h('h3', { text: opts.title }), opts.content, err,
      h('div', { class: 'modal-actions' }, [submit, saveNew, cancel])
    ]);
    function busy(on) {
      submit.disabled = on; if (saveNew) saveNew.disabled = on;
      submit.classList.toggle('is-busy', on);
    }
    function showErr(e) { err.textContent = (e && e.message) || 'حدث خطأ'; err.hidden = false; busy(false); }
    function close() {
      document.removeEventListener('keydown', onKey);
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    }
    function onKey(e) { if (e.key === 'Escape' && overlay.parentNode && overlay === lastOverlay()) close(); }
    function lastOverlay() { var all = document.querySelectorAll('.overlay'); return all[all.length - 1]; }
    function focusables() {
      return Array.prototype.filter.call(form.querySelectorAll('input,select,textarea'), function (el) {
        return !el.disabled && el.type !== 'hidden' && !el.hidden && !(el.closest('[hidden]'));
      });
    }
    function doSaveNew() {
      err.hidden = true; busy(true);
      var r;
      try { r = quiet(opts.onSaveNew); } catch (e) { r = Promise.reject(e); }
      Promise.resolve(r).then(function () {
        busy(false);
        var f = (opts.focusAfterSave && form.querySelector(opts.focusAfterSave)) || focusables()[0];
        if (f) f.focus();
      }).catch(showErr);
    }
    function move(step, from) {
      var list = focusables(), i = list.indexOf(from);
      var n = list[i + step];
      if (i >= 0 && n) n.focus();
    }
    form.addEventListener('keydown', function (e) {
      var tag = e.target.tagName;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (e.defaultPrevented || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;   // قائمة مفتوحة تعالجها بنفسها
        e.preventDefault(); move(e.key === 'ArrowDown' ? 1 : -1, e.target); return;
      }
      if (e.key !== 'Enter') return;
      if (tag === 'TEXTAREA' || tag === 'BUTTON') return;
      if (e.ctrlKey || e.metaKey) { e.preventDefault(); if (saveNew) doSaveNew(); else submit.click(); return; }
      if (e.defaultPrevented && !e.comboSelected) return;   // قائمة اختيار مفتوحة تعالج Enter بنفسها
      e.preventDefault();
      if (e.comboSelected) { move(1, e.target); return; }    // اختيار عنصر من قائمة: ننتقل للخانة التالية
      submit.click();                                        // Enter في أي خانة أخرى = حفظ
    });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      err.hidden = true; busy(true);
      var r;
      try { r = quiet(opts.onSubmit); } catch (e) { r = Promise.reject(e); }
      Promise.resolve(r).then(close).catch(showErr);
    });
    overlay.appendChild(form);
    document.body.appendChild(overlay);
    document.addEventListener('keydown', onKey);
    var first = focusables()[0];
    if (first) first.focus();
    return { close: close };
  }

  /* ---------- الاتصال بالخادم ---------- */

  function storeGet() { try { return window.localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
  function storeSet(v) {
    try {
      if (v) window.localStorage.setItem(TOKEN_KEY, v); else window.localStorage.removeItem(TOKEN_KEY);
    } catch (e) { /* التخزين غير متاح: نبقى بالذاكرة فقط */ }
  }

  /* ---------- حفظ الجلسة والبيانات في الجهاز (تشغيل فوري ودون إنترنت) ----------
     نحفظ ملف المستخدم وآخر ما قرأته الشاشات، فيفتح التطبيق فورًا حتى بلا اتصال.
     يُمسح كل ذلك عند الخروج أو انتهاء الجلسة. */
  var ME_KEY = 'inourar_me', CACHE_PREFIX = 'inourar_c_', CACHE_MAX = 1500000, CACHE_ENTRY_MAX = 300000;
  function lsGetJ(k) { try { return JSON.parse(window.localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function lsSetJ(k, v) { try { window.localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function saveMe() { if (state.token && state.user) lsSetJ(ME_KEY, { token: state.token, user: state.user, roleLabel: state.roleLabel, build: state.build }); }
  function loadMe() { var m = lsGetJ(ME_KEY); return (m && m.token && m.user && m.token === state.token) ? m : null; }
  function cacheKey() { return CACHE_PREFIX + (state.user ? state.user.id : ''); }
  function loadCache() { var c = lsGetJ(cacheKey()); cache = (c && typeof c === 'object') ? c : {}; stale = {}; }
  var cacheTimer = null;
  function saveCacheSoon() {
    if (!state.user) return;
    clearTimeout(cacheTimer);
    cacheTimer = setTimeout(function () {
      if (!state.user) return;
      var all = Object.assign({}, stale, cache), out = {}, size = 0, keys = Object.keys(all);
      for (var i = keys.length - 1; i >= 0; i--) {                    // الأحدث أولًا
        var v = all[keys[i]];
        if (typeof v !== 'string' || v.length > CACHE_ENTRY_MAX || size + v.length > CACHE_MAX) continue;
        out[keys[i]] = v; size += v.length;
      }
      lsSetJ(cacheKey(), out);
    }, 1200);
  }
  function purgeStored() {
    try {
      window.localStorage.removeItem(ME_KEY);
      Object.keys(window.localStorage).forEach(function (k) { if (k.indexOf(CACHE_PREFIX) === 0) window.localStorage.removeItem(k); });
    } catch (e) {}
  }

  /* ---------- مؤشر التحميل ----------
     شريط علوي فورًا؛ نافذة المقولات فقط للطلبات البطيئة (>0.6ث) التي يطلبها المستخدم بتنقله؛
     الحفظ داخل النوافذ (quiet) يكتفي بالشريط ودوران الزر؛ التحديث الخلفي (silent) بلا أي مؤشر. */
  var DEFAULT_QUOTES = [
    'نبني اليوم ما يبقى أثره غدًا.',
    'الدقة في المخطط توفّر الأخطاء في الموقع.',
    'الأمانة في الحساب هي أساس الثقة بين المكتب وزبائنه.',
    'كل مشروع ناجح بدأ بخطة واضحة وتنفيذ منضبط.',
    'الجودة لا تُصادَف، بل تُصنع بالتفاصيل.',
    'العمارة فنّ يخدم الإنسان قبل أن يخدم الواجهة.',
    'ما لا يُقاس لا يمكن تحسينه، فسجّل بدقة.',
    'الوقت في الورشة مال، فنظّم عملك تربح.',
    'أساس البناء المتين: تخطيط محكم وتنفيذ أمين.',
    'الإتقان عادة تُبنى كل يوم، كما يُبنى الجدار حجرًا حجرًا.',
    'رضا الزبون ثمرة الصدق في الوعد والالتزام بالموعد.',
    'التنظيم اليوم يختصر عناء الغد.'
  ];
  var quotes = DEFAULT_QUOTES.slice();
  var loadState = { n: 0, ov: 0, timer: null, hideTimer: null, rot: null, bar: null, ovEl: null, qEl: null };
  var forceQuiet = false;

  function loaderEls() {
    if (loadState.bar) return;
    loadState.bar = h('div', { class: 'topbar-progress', hidden: true });
    loadState.qEl = h('p', { class: 'loader-quote' });
    loadState.ovEl = h('div', { class: 'loader-overlay', hidden: true, role: 'status', 'aria-live': 'polite' }, [
      h('div', { class: 'loader-card' }, [
        h('span', { class: 'logo-mark loader-logo', role: 'img', 'aria-label': 'INOURAR' }),
        h('div', { class: 'loader-spin' }),
        loadState.qEl,
        h('div', { class: 'loader-sub', text: 'جارٍ التحميل...' })
      ])
    ]);
    document.body.appendChild(loadState.bar);
    document.body.appendChild(loadState.ovEl);
  }
  function nextQuote() { loadState.qEl.textContent = quotes[Math.floor(Math.random() * quotes.length)]; }
  function showOverlay() {
    loadState.timer = null;
    if (loadState.ov > 0) { nextQuote(); loadState.ovEl.hidden = false; if (!loadState.rot) loadState.rot = setInterval(nextQuote, 4500); }
  }
  function hideAll() {
    loadState.hideTimer = null;
    if (loadState.ov === 0) { loadState.ovEl.hidden = true; clearInterval(loadState.rot); loadState.rot = null; }
    if (loadState.n === 0) loadState.bar.hidden = true;
  }
  function loadStart(mode) {
    if (mode === 'silent') return;
    loaderEls();
    loadState.n++;
    clearTimeout(loadState.hideTimer); loadState.hideTimer = null;   // طلب متتابع: لا نُخفي ثم نُظهر ثانية (يمنع الوميض المزدوج)
    loadState.bar.hidden = false;
    if (mode === 'full') {
      loadState.ov++;
      if (loadState.ovEl.hidden && !loadState.timer) loadState.timer = setTimeout(showOverlay, 600);
    }
  }
  function loadEnd(mode) {
    if (mode === 'silent') return;
    loadState.n = Math.max(0, loadState.n - 1);
    if (mode === 'full') loadState.ov = Math.max(0, loadState.ov - 1);
    if (loadState.ov === 0 && loadState.timer) { clearTimeout(loadState.timer); loadState.timer = null; }
    clearTimeout(loadState.hideTimer);
    loadState.hideTimer = setTimeout(hideAll, 250);
    if (loadState.n === 0) setTimeout(function () { if (loadState.n === 0) clearSkeletons(); }, 0);
  }
  function skeleton() {
    var rows = [];
    for (var i = 0; i < 5; i++) rows.push(h('div', { class: 'skel-row', style: 'width:' + (100 - i * 9) + '%' }));
    return h('div', { class: 'skel', 'aria-hidden': 'true' }, rows);
  }
  // يضيف هيكلًا رماديًا متحركًا أثناء الانتظار (يُزال تلقائيًا عند انتهاء الطلبات)
  function addSkeleton(container) { if (loadState.n > 0) container.appendChild(skeleton()); }
  function clearSkeletons() {
    Array.prototype.slice.call(document.querySelectorAll('.skel')).forEach(function (el) { if (el.parentNode) el.parentNode.removeChild(el); });
  }
  // ينفّذ fn (متزامنًا) بحيث تكتفي طلباته بالشريط العلوي دون نافذة التحميل الكاملة
  function quiet(fn) {
    forceQuiet = true;
    try { return fn(); } finally { forceQuiet = false; }
  }

  // وضعان للاتصال: داخل Apps Script (google.script.run) أو من الصفحة المستقلة (PWA) عبر fetch إلى doPost.
  // في الوضع المستقل يوفّر config.js العنوان INOURAR_CONFIG.API_URL.
  function apiUrl() { return (window.INOURAR_CONFIG && window.INOURAR_CONFIG.API_URL) || ''; }
  function httpCall(fnName, args) {
    var body = fnName === 'rpc'
      ? { token: args[0], action: args[1], payload: args[2] }
      : { action: args[0], payload: args[1] };            // rpcPublic: الدخول
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var to = ctl ? setTimeout(function () { ctl.abort(); }, 90000) : null;
    return fetch(apiUrl(), {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined
    }).then(function (r) { return r.text(); }).then(function (tx) {
      if (to) clearTimeout(to);
      try { return JSON.parse(tx); } catch (e) { throw new Error('تعذّر الاتصال بالخادم'); }   // صفحة خطأ من Google = فشل شبكة (لا code)
    }, function (e) { if (to) clearTimeout(to); throw new Error('تعذّر الاتصال بالخادم'); });
  }
  function call(fnName, args, mode) {
    mode = mode || 'full';
    loadStart(mode);
    return new Promise(function (resolve, reject) {
      function ok(res) {
        loadEnd(mode);
        if (res && res.ok) { resolve(res.data); return; }
        var err = new Error((res && res.message) || 'حدث خطأ');
        err.code = res && res.code;
        reject(err);
      }
      function fail(e) { loadEnd(mode); reject(new Error((e && e.message) || 'تعذّر الاتصال بالخادم')); }
      if (apiUrl() || typeof google === 'undefined' || !google.script) { httpCall(fnName, args).then(ok, fail); return; }
      google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fnName](...args);
    });
  }

  /* ---------- كاش القراءة (يُظهر الشاشة فورًا ثم يحدّثها بصمت إن تغيّرت البيانات) ---------- */
  var cache = {};       // key -> JSON
  var stale = {};       // نسخ قديمة بعد أي تعديل: لا تُعرض والاتصال متاح، لكنها تُنقذ الشاشة عند انقطاع الإنترنت
  function invalidate() { stale = Object.assign(stale, cache); cache = {}; }
  var watch = {};       // الطلبات التي قرأتها الشاشة الحالية (للتحديث الدوري)
  var inflight = {};
  var NEUTRAL = { me: 1, logout: 1, 'ui.quotes': 1, 'push.register': 1, 'push.unregister': 1, 'push.test': 1 };
  function cacheable(action) { return /\.(list|options|summary|movements|get|defs|items)$/.test(action); }
  function modalOpen() { return !!document.querySelector('.overlay'); }

  function revalidate(key, action, payload) {
    if (inflight[key]) return;
    inflight[key] = true;
    call('rpc', [state.token, action, payload], 'silent').then(function (data) {
      inflight[key] = false;
      var js = JSON.stringify(data);
      if (cache[key] !== undefined && cache[key] !== js) {
        cache[key] = js; saveCacheSoon();
        if (state.refresh && !modalOpen()) state.refresh(true);
      }
    }).catch(function (err) {
      inflight[key] = false;
      if (err.code === 'AUTH_REQUIRED') endSession(err.message);
    });
  }

  // طلب بجلسة. عند انتهاء الجلسة نعود إلى صفحة الدخول تلقائيًا.
  // opts: { mode: 'full'|'quiet'|'silent', fresh: true (تجاوز الكاش) }
  function rpc(action, payload, opts) {
    opts = opts || {};
    payload = payload || {};
    var key = action + '|' + JSON.stringify(payload);
    var canCache = cacheable(action);
    if (canCache && !opts.fresh && cache[key] !== undefined) {
      watch[key] = { action: action, payload: payload };
      revalidate(key, action, payload);
      return Promise.resolve(JSON.parse(cache[key]));
    }
    var mode = opts.mode || (forceQuiet ? 'quiet' : 'full');
    return call('rpc', [state.token, action, payload], mode).then(function (data) {
      if (canCache) { delete stale[key]; cache[key] = JSON.stringify(data); watch[key] = { action: action, payload: payload }; saveCacheSoon(); }
      else if (!NEUTRAL[action]) { invalidate(); saveCacheSoon(); warmSoon(8000); if (/^transfers\./.test(action)) setTimeout(function () { pollNotif(); }, 300); }      // أي تعديل يبطل الكاش كله
      return data;
    }).catch(function (err) {
      if (err.code === 'AUTH_REQUIRED') { endSession(err.message); }
      if (!err.code && canCache) {                       // انقطاع الشبكة: نعرض آخر نسخة محفوظة بدل الخطأ
        var old = cache[key] !== undefined ? cache[key] : stale[key];
        if (old !== undefined) return JSON.parse(old);
      }
      throw err;
    });
  }

  /* تسخين الكاش: بعد الدخول نجلب بصمت ما تحتاجه الشاشات الأساسية، فتعمل كلها حتى دون إنترنت */
  var warmTimer = null, warmWaits = 0;
  function warmList() {
    var u = state.user; if (!u || u.role === 'CLIENT') return [];
    var adm = u.role === 'DG' || u.role === 'RESP';
    var l = [['dashboard.summary', {}], ['charges.options', {}], ['charges.list', {}], ['caisses.summary', {}], ['transfers.list', {}]];
    if (!adm) l.push(['caisses.movements', { caisse: u.id }]);
    else l.push(['projects.options', {}], ['projects.list', {}], ['versements.list', {}], ['clients.list', {}], ['users.list', {}]);
    return l;
  }
  function warmSoon(ms) {
    clearTimeout(warmTimer);
    warmTimer = setTimeout(function () {
      if (!state.user || navigator.onLine === false) return;
      if (loadState.n > 0 && (warmWaits = (warmWaits || 0) + 1) < 12) { warmSoon(1500); return; }     // لا نزاحم الشاشة التي يفتحها المستخدم الآن
      warmWaits = 0;
      var list = warmList(), i = 0;
      (function next() {
        if (!state.user || i >= list.length) return;
        var a = list[i++][0], pl = list[i - 1][1], key = a + '|' + JSON.stringify(pl);
        call('rpc', [state.token, a, pl], 'silent').then(function (d) { delete stale[key]; cache[key] = JSON.stringify(d); saveCacheSoon(); })
          .catch(function (e) { if (e && e.code === 'AUTH_REQUIRED') endSession(e.message); })
          .then(function () { setTimeout(next, 150); });
      })();
    }, ms || 1500);
  }
  window.addEventListener('online', function () { warmSoon(1500); });

  // تسجّله الشاشة الحالية: ما الذي يُعاد رسمه عند التحديث (يدويًا أو عند تغيّر البيانات)
  function refresher(fn) { state.refresh = fn; watch = {}; }

  // تحديث دوري صامت (كل 60ث) يلتقط ما أضافه الآخرون دون أن يضطر المستخدم لإعادة تحميل الصفحة
  setInterval(function () {

    var ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;     // لا نقاطع من يكتب

  }, 60000);

    var btn = $('refreshBtn');
    invalidate();
    btn.classList.add('spin');
    setTimeout(function () { btn.classList.remove('spin'); }, 900);
    if (state.refresh) { state.refresh(false); return; }
    if (state.module) { openModule(state.module); return; }
    if (homeRender) { homeRender($('homeBody')); return; }

  }

  /* ---------- حركة الأرقام: عدّاد يصعد من 0 إلى القيمة عند فتح الشاشة ----------
     أي عنصر فيه data-count (+ اختياري data-fmt=money|int و data-suffix) يتحرك مرة واحدة. */
  var animUntil = 0;
  var entering = false;
  var settleT = null;
  function unsettle() {
    var app = $('appView'); if (!app) return;
    app.classList.remove('settled');
    clearInterval(settleT);
    var calm = 0, n = 0;
    settleT = setInterval(function () {
      n++;
      if (document.querySelector('.skel,.dash-skel')) calm = 0; else calm += 300;
      if (calm >= 1500 || n > 60) { clearInterval(settleT); app.classList.add('settled'); }
    }, 300);
  }
  function armAnimate(ms) { animUntil = Date.now() + (ms || 6000); entering = true; unsettle(); }
  function takeEntering() { var e = entering; entering = false; return e; }
  function reducedMotion() {
    try { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
  }
  function fmtCount(el, v) {
    var fmt = el.getAttribute('data-fmt') || 'money', suffix = el.getAttribute('data-suffix') || '';
    var money = window.INOURAR && window.INOURAR.ui && window.INOURAR.ui.money;
    var txt = fmt === 'int' ? String(Math.round(v)) : (money ? money(v) : v.toFixed(2));
    return txt + suffix;
  }
  function countUp(el) {
    if (el.getAttribute('data-counted')) return;
    el.setAttribute('data-counted', '1');
    var target = Number(el.getAttribute('data-count'));
    if (!isFinite(target) || reducedMotion()) return;
    var dur = 900, t0 = null;
    var raf = window.requestAnimationFrame || function (fn) { return setTimeout(function () { fn(Date.now()); }, 16); };
    function step(ts) {
      if (t0 === null) t0 = ts;
      var k = Math.min(1, (ts - t0) / dur);
      var e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmtCount(el, target * e);
      if (k < 1) raf(step); else el.textContent = fmtCount(el, target);
    }
    el.textContent = fmtCount(el, 0);
    raf(step);
  }
  function scanCounts(node) {
    if (!node || node.nodeType !== 1 || Date.now() > animUntil) return;
    if (node.hasAttribute && node.hasAttribute('data-count')) countUp(node);
    if (node.querySelectorAll) Array.prototype.forEach.call(node.querySelectorAll('[data-count]'), countUp);
  }
  if (typeof MutationObserver !== 'undefined') {
    new MutationObserver(function (list) {
      list.forEach(function (m) { Array.prototype.forEach.call(m.addedNodes, scanCounts); });
    }).observe(document.body, { childList: true, subtree: true });
  }

  /* ---------- انتقال ناعم بين التبويبات ---------- */
  function enter(el) {
    el.classList.remove('view-enter');
    void el.offsetWidth;
    el.classList.add('view-enter');
  }

  var homeRender = null;

    Array.prototype.forEach.call($('sideNav').querySelectorAll('.nav-item'), function (b) {
      var on = b.getAttribute('data-key') === key;
      b.classList.toggle('on', on);
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }
  function closeDrawer() { $('sidebar').classList.remove('open'); $('navScrim').hidden = true; }

  function openModule(key) {
    var def = views[key];
    if (!def) return;
    closeDrawer();
    $('moduleTitle').textContent = def.title;
    $('pageTitle').textContent = def.title;
    var body = $('moduleBody');
    body.textContent = '';

    $('homeView').hidden = true;
    $('moduleView').hidden = false;
