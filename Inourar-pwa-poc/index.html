<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>INOURAR — تجربة الإثبات</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f9;color:#1b2430}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px} section{background:#fff;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 3px #0002}
h2{font-size:15px;margin:0 0 8px} input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #bbb;width:100%;box-sizing:border-box;margin:4px 0}
button{background:#1f3a5f;color:#fff;border:0;cursor:pointer} button:disabled{opacity:.5}
pre{background:#eef1f5;padding:8px;border-radius:8px;white-space:pre-wrap;direction:ltr;text-align:left;font-size:12px;max-height:200px;overflow:auto}
.ok{color:#0a7a3d}.bad{color:#b3261e}
</style></head><body><main>
<h1>INOURAR — تجربة الإثبات</h1>
<section><h2>1) عنوان الخادم (رابط Web App ينتهي بـ /exec)</h2>
<input id="url" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec">
<button id="save">حفظ</button></section>
<section><h2>2) سرعة الاتصال</h2><button id="ping">قياس 5 طلبات</button><pre id="pingOut">—</pre></section>
<section><h2>3) تسجيل الدخول واستدعاء حقيقي</h2>
<input id="u" placeholder="اسم المستخدم" autocomplete="username"><input id="p" type="password" placeholder="كلمة السر" autocomplete="current-password">
<button id="login">دخول</button><button id="sum" disabled>notifications.summary</button><pre id="apiOut">—</pre></section>
<section><h2>4) التثبيت ودون إنترنت</h2><div id="inst">—</div><button id="install" hidden>تثبيت التطبيق</button>
<p>بعد التثبيت: فعّل وضع الطيران وافتح التطبيق؛ يجب أن تظهر هذه الصفحة.</p></section>
<section><h2>5) الإشعارات</h2><button id="push">تفعيل الإشعارات</button><button id="ptest" disabled>إرسال إشعار تجريبي لي</button><pre id="pushOut">—</pre></section>
<script src="firebase-config.js"></script>
<script>
const $=id=>document.getElementById(id), LS=localStorage;
$('url').value=LS.getItem('srv')||''; let token=LS.getItem('tok')||'';
$('save').onclick=()=>{LS.setItem('srv',$('url').value.trim());alert('تم')};
async function call(action,payload){
  const t0=performance.now();
  const r=await fetch($('url').value.trim(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token,payload:payload||{}})});
  const j=await r.json(); j._ms=Math.round(performance.now()-t0); return j;
}
$('ping').onclick=async()=>{const o=[];try{for(let i=0;i<5;i++){const j=await call('ping');o.push((i+1)+': '+(j.ok?'ok':'fail')+' '+j._ms+' ms')}}catch(e){o.push('خطأ: '+e.message)}$('pingOut').textContent=o.join('\n')};
$('login').onclick=async()=>{try{const j=await call('login',{username:$('u').value,password:$('p').value});
  if(j.ok){token=j.data.token||'';LS.setItem('tok',token);$('sum').disabled=false;$('apiOut').textContent='دخول ناجح ('+j._ms+' ms) — الحقول: '+Object.keys(j.data).join(', ')}else $('apiOut').textContent=j.message}catch(e){$('apiOut').textContent='خطأ: '+e.message}};
$('sum').onclick=async()=>{try{const j=await call('notifications.summary');$('apiOut').textContent=JSON.stringify(j,null,1)}catch(e){$('apiOut').textContent='خطأ: '+e.message}};
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('install').hidden=false});
$('install').onclick=()=>dp&&dp.prompt();
$('inst').textContent=(matchMedia('(display-mode: standalone)').matches?'يعمل كتطبيق مثبّت ✔':'يعمل في المتصفح')+' — '+('serviceWorker' in navigator?'Service Worker مدعوم':'غير مدعوم');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
$('push').onclick=async()=>{const o=$('pushOut');
  try{
    if(!self.FB_CONFIG||!self.FB_CONFIG.apiKey||!self.FB_VAPID){o.textContent='firebase-config.js فارغ بعد';return}
    if(!('Notification' in window)){o.textContent='المتصفح لا يدعم الإشعارات (على آيفون: أضف التطبيق للشاشة الرئيسية أولًا)';return}
    const perm=await Notification.requestPermission(); if(perm!=='granted'){o.textContent='تم رفض الإذن';return}
    const load=s=>new Promise((res,rej)=>{const e=document.createElement('script');e.src=s;e.onload=res;e.onerror=rej;document.head.appendChild(e)});
    await load('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');await load('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js');
    firebase.initializeApp(self.FB_CONFIG);const reg=await navigator.serviceWorker.ready;
    const tk=await firebase.messaging().getToken({vapidKey:self.FB_VAPID,serviceWorkerRegistration:reg});
    if(!token){o.textContent='سجّل الدخول (القسم 3) ثم أعد المحاولة';return}
    const rg=await call('push.register',{token:tk});o.textContent=rg.ok?('تم تسجيل الجهاز ✔ عدد الأجهزة: '+rg.data.devices):('فشل التسجيل: '+rg.message);$('ptest').disabled=!rg.ok;
  }catch(e){o.textContent='خطأ: '+e.message}};
$('ptest').onclick=async()=>{const o=$('pushOut');o.textContent='جارٍ الإرسال…';try{const j=await call('push.test');o.textContent=j.ok?('أُرسل إلى '+j.data.sent+' جهاز — انتظر الإشعار'):('فشل: '+j.message)}catch(e){o.textContent='خطأ: '+e.message}};
</script></main></body></html>
