  /* ---------- البحث السريع (Ctrl K) ---------- */
  function openPalette() {
    if (!state.user || $('appView').hidden || document.querySelector('.overlay')) return;
    var items = [];
    MODULES.filter(function (m) { return m.roles.indexOf(state.user.role) >= 0 && views[m.key]; }).forEach(function (m) {
      items.push({ label: m.label, sub: 'قسم', run: function () { openModule(m.key); } });
    });
    items.unshift({ label: 'لوحة القيادة', sub: 'قسم', run: goHome });
    var input = h('input', { type: 'search', placeholder: 'ابحث عن قسم أو مشروع...', 'aria-label': 'بحث سريع', autocomplete: 'off' });
    var list = h('ul', { class: 'pal-list', role: 'listbox' });
    var hot = 0, shown = [];
    var overlay = h('div', { class: 'overlay pal' }, [h('div', { class: 'card pal-card' }, [input, list])]);
    function close() { document.removeEventListener('keydown', onKey, true); if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }
    function pick(it) { close(); it.run(); }
    function draw() {
      var q = input.value.trim().toLowerCase();
      shown = items.filter(function (it) { return !q || (it.label + ' ' + (it.sub || '') + ' ' + (it.key || '')).toLowerCase().indexOf(q) >= 0; }).slice(0, 12);
      if (hot >= shown.length) hot = Math.max(0, shown.length - 1);
      list.textContent = '';
      if (!shown.length) list.appendChild(h('li', { class: 'none', text: 'لا نتائج' }));
      shown.forEach(function (it, i) {
        list.appendChild(h('li', { class: i === hot ? 'hot' : '', role: 'option', onmousedown: function (e) { e.preventDefault(); pick(it); } }, [
          h('span', { text: it.label }), h('small', { text: it.sub || '' })
        ]));
      });
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(); return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); hot = Math.min(shown.length - 1, hot + 1); draw(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); hot = Math.max(0, hot - 1); draw(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (shown[hot]) pick(shown[hot]); }
    }
    overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) close(); });
    input.addEventListener('input', function () { hot = 0; draw(); });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(overlay);
    draw(); input.focus();
    if (state.user.role !== 'CLIENT') {
      rpc('projects.list', {}, { mode: 'silent' }).then(function (ps) {
        ps.filter(function (p) { return p.active; }).forEach(function (p) {
          items.push({ label: p.display_name, sub: p.id + (p.engineer_name ? ' · ' + p.engineer_name : ''), run: function () { INOURAR.pending.project = p.id; openModule('projects'); } });
        });
        if (overlay.parentNode) draw();
      }).catch(function () {});
    }
  }
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); openPalette(); }
  });

  function goHome() {
    closeDrawer();
    state.module = null; state.refresh = null; watch = {};
    armAnimate();
    $('moduleView').hidden = true;
    $('moduleBody').textContent = '';
    $('homeView').hidden = false;
    enter($('homeView'));
    $('pageTitle').textContent = 'لوحة القيادة';
    setNav('home');
    window.scrollTo(0, 0);
    if (homeRender) homeRender($('homeBody'));
  }


  /* ---------- الإشعارات: شارة على «الصناديق» + تنبيه عند الجديد ---------- */
  var notif = { pending: { count: 0, amount: 0 }, decided: [] };
  var notifListeners = [];
  var lastNotifSig = null;
  function notifCount() {
    if (!state.user) return 0;
    return state.user.role === 'ING' ? notif.decided.length : notif.pending.count;
  }
  function paintBadges() {
    var n = notifCount();
    var item = $('sideNav').querySelector('.nav-item[data-key="caisses"]');
    if (item) {
      var b = item.querySelector('.nbadge');
      if (!n) { if (b) b.parentNode.removeChild(b); }
      else { if (!b) { b = h('span', { class: 'nbadge' }); item.appendChild(b); } b.textContent = String(n); }
    }
    var mb = $('menuBtn');
    if (mb) mb.classList.toggle('has-dot', n > 0);
  }
  function money_(n) { return (window.INOURAR && window.INOURAR.ui && window.INOURAR.ui.money) ? window.INOURAR.ui.money(n) : String(n); }
  function pollNotif() {
    if (!state.user || state.user.role === 'CLIENT' || !state.token) return;
    call('rpc', [state.token, 'notifications.summary', {}], 'silent').then(function (d) {
      notif = d;
      paintBadges();
      var sig = state.user.role === 'ING' ? d.decided.map(function (x) { return x.id; }).join(',') : String(d.pending.count);
      if (lastNotifSig !== sig && sig && sig !== '0') {
        if (state.user.role === 'ING') {
          var x = d.decided[d.decided.length - 1];
          toast(x.status === 'APPROVED' ? '✓ قُبل طلب المبلغ ' + money_(x.amount) + ' دج — أكّد الاستلام من «الصناديق»' : 'رُفض طلب المبلغ ' + money_(x.amount) + ' دج' + (x.reason ? ': ' + x.reason : ''), x.status === 'APPROVED' ? 'big' : 'error', 7000);
        } else if (d.pending.count) {
          toast('لديك ' + d.pending.count + ' طلب مبلغ بانتظار الموافقة (' + money_(d.pending.amount) + ' دج)', 'big', 6000);
        }
      }
      lastNotifSig = sig;
      notifListeners.slice().forEach(function (fn) { try { fn(notif); } catch (e) {} });
    }).catch(function (err) { if (err && err.code === 'AUTH_REQUIRED') endSession(err.message); });
  }
  setInterval(function () { if (document.visibilityState !== 'hidden') pollNotif(); }, 45000);

  /* ---------- زر الرجوع في المتصفح: لا يُخرج من التطبيق دون تأكيد ---------- */
  var guard = { armed: false, leaving: false };
  function armGuard() {
    if (guard.armed) return;
    guard.armed = true;
    try { history.replaceState({ inr: 'base' }, ''); history.pushState({ inr: 'app' }, ''); } catch (e) { guard.armed = false; }
  }
  function confirmLeave() {
    if (document.querySelector('.overlay.leave')) return;
    var ov = null;
    modal({
      title: 'مغادرة التطبيق؟', submitLabel: 'مغادرة',
      content: h('p', { text: 'ضغطت زر الرجوع. هل تريد مغادرة التطبيق؟ الأسطر غير المحفوظة تبقى في هاتفك وتُرسل عند عودتك.' }),
      onSubmit: function () { guard.leaving = true; try { history.go(-2); } catch (e) {} }
    });
    ov = document.querySelectorAll('.overlay'); if (ov.length) ov[ov.length - 1].classList.add('leave');
  }
  window.addEventListener('popstate', function () {
    if (!guard.armed || guard.leaving || !state.user || $('appView').hidden) return;
    try { history.pushState({ inr: 'app' }, ''); } catch (e) {}
    var overlays = document.querySelectorAll('.overlay');
    if (overlays.length) {          // نافذة مفتوحة: الرجوع يغلقها
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
      var after = document.querySelectorAll('.overlay');
      if (after.length === overlays.length && after[after.length - 1].parentNode) after[after.length - 1].parentNode.removeChild(after[after.length - 1]);
      return;
    }
    if (state.module) { goHome(); return; }      // داخل قسم: الرجوع إلى لوحة القيادة
    confirmLeave();
  });

  function renderApp() {
    var u = state.user;
    $('userName').textContent = u.full_name;
    $('userAvatar').textContent = (u.full_name || '?').trim().charAt(0);
    $('userRole').textContent = state.roleLabel + (state.build ? ' · v' + state.build : '');
    var nav = $('sideNav');
    nav.textContent = '';
    function navItem(key, label, ic, ready) {
      var btn = h('button', {
        class: 'nav-item' + (ready ? '' : ' off'), type: 'button', 'data-key': key,
        onclick: ready ? function () { if (key === 'home') goHome(); else openModule(key); } : null
      }, [icon(ic), h('span', { text: label }), ready ? null : h('span', { class: 'soon', text: 'قريبًا' })]);
      if (!ready) btn.setAttribute('aria-disabled', 'true');
      nav.appendChild(btn);
    }
    navItem('home', 'لوحة القيادة', 'home', true);
    MODULES.filter(function (m) { return m.roles.indexOf(u.role) >= 0; }).forEach(function (m) {
      navItem(m.key, m.label, m.key, !!views[m.key]);
    });
    goHome();
    showView('appView');
    loadQuotes();
    armGuard();
    lastNotifSig = null; notif = { pending: { count: 0, amount: 0 }, decided: [] };
    pollNotif();
  }

  // المقولات تُحدَّث من الإعدادات؛ نجلبها بصمت وإن فشل الجلب نبقى على الافتراضية
  function loadQuotes() {
    rpc('ui.quotes', {}, { mode: 'silent' }).then(function (q) { if (q && q.length) quotes = q; }).catch(function () {});
  }

  function boot() {
    state.token = storeGet();
    if (!state.token) { showView('loginView'); return; }
    var saved = loadMe();
    if (saved) {
      // تشغيل فوري من بيانات الجهاز (يعمل دون إنترنت)، ثم نتحقق من الجلسة بصمت
      state.user = saved.user; state.roleLabel = saved.roleLabel; state.build = saved.build || '';
      loadCache(); renderApp(); warmSoon(2500);
      rpc('me', {}, { mode: 'silent' }).then(function (data) {
        if (!state.user) return;
        var changed = JSON.stringify(data.user) !== JSON.stringify(state.user) || data.roleLabel !== state.roleLabel;
        state.user = data.user; state.roleLabel = data.roleLabel; state.build = data.build || ''; saveMe();
        if (changed) renderApp();
      }).catch(function () { /* AUTH_REQUIRED تُنهي الجلسة داخل rpc؛ انقطاع الشبكة نتجاهله */ });
      return;
    }
    rpc('me').then(function (data) {
      state.user = data.user; state.roleLabel = data.roleLabel; state.build = data.build || '';
      saveMe(); loadCache(); renderApp(); warmSoon(2500);
    }).catch(function (err) {
      if (err.code !== 'AUTH_REQUIRED') { endSession(err.message); }
    });
  }

  /* ---------- الأحداث ---------- */

  $('loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = $('loginBtn');
    showLoginError('');
    btn.disabled = true; btn.textContent = 'جاري الدخول...';
    call('rpcPublic', ['login', { username: $('loginUser').value, password: $('loginPass').value }])
      .then(function (data) {
        state.token = data.token; state.user = data.user;
        storeSet(data.token);
        $('loginPass').value = '';
        return data.roleLabel ? data : rpc('me');
      })
      .then(function (me) { state.roleLabel = me.roleLabel; state.build = me.build || ''; saveMe(); loadCache(); renderApp(); warmSoon(2500); })
      .catch(function (err) { showLoginError(err.message); })
      .then(function () { btn.disabled = false; btn.textContent = 'دخول'; });
  });

  $('refreshBtn').addEventListener('click', manualRefresh);

  $('logoutBtn').addEventListener('click', function () {
    rpc('logout').catch(function () {}).then(function () { endSession(''); });
  });

  $('searchBtn').addEventListener('click', openPalette);

  /* ---------- الوضع الداكن: يُحفظ عند هذا المتصفح فقط ---------- */
  function currentTheme() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function paintThemeBtns() {
    var dark = currentTheme() === 'dark';
    Array.prototype.forEach.call(document.querySelectorAll('[data-theme-toggle]'), function (b) {
      b.textContent = '';
      b.appendChild(icon(dark ? 'sun' : 'moon', 18));
      b.title = dark ? 'الوضع الفاتح' : 'الوضع الداكن';
      b.setAttribute('aria-label', b.title);
    });
  }
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('inourar_theme', t); } catch (e) {}
    paintThemeBtns();
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-theme-toggle]'), function (b) {
    b.addEventListener('click', function () { setTheme(currentTheme() === 'dark' ? 'light' : 'dark'); });
  });
  paintThemeBtns();
  $('menuBtn').addEventListener('click', function () {
    var open = !$('sidebar').classList.contains('open');
    $('sidebar').classList.toggle('open', open); $('navScrim').hidden = !open;
  });
  $('navScrim').addEventListener('click', closeDrawer);

  // واجهة تستعملها ملفات الشاشات (views-*.html)
  window.INOURAR = {
    rpc: rpc, h: h, field: field, toast: toast, modal: modal, register: register,
    ui: {}, pending: {},
    skel: addSkeleton, quiet: quiet, refresher: refresher, icon: icon, armAnimate: armAnimate, takeEntering: takeEntering,
    setHome: function (fn) { homeRender = fn; }, openModule: function (k) { openModule(k); },
    user: function () { return state.user; },
    notif: { get: function () { return notif; }, on: function (fn) { notifListeners.push(fn); }, off: function (fn) { notifListeners = notifListeners.filter(function (x) { return x !== fn; }); }, refresh: pollNotif }
  };

  // نؤجّل البدء إلى ما بعد تسجيل الشاشات (ملفاتها تُحمَّل بعد هذا الملف)
  window.addEventListener('load', boot);
})();
</script>

<script>
/* مكوّنات الإدخال السريع — تُستعمل في كل النماذج:
   combo: اكتب أول حرف فتظهر الخيارات | chips: نقرة واحدة | dateField: اليوم افتراضيًا | moneyField: مبلغ بفواصل */
(function () {
  'use strict';
  var I = window.INOURAR, h = I.h;

  // توحيد النص للبحث: بلا تشكيل ولا لهجات فرنسية، وتوحيد الألف والياء والتاء المربوطة
  function norm(s) {
    return String(s == null ? '' : s).normalize('NFD')
      .replace(/[̀-ًͯ-ٰٟـ]/g, '')
      .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').toLowerCase();
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function isoDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

  /* ---------- combo ---------- */
  // items: [{id, label, sub?}]  opts: {value, placeholder, onChange}
  function combo(items, opts) {
    opts = opts || {};
    var selected = null;
    var matches = [], hot = 0, open = false;
    var input = h('input', { type: 'text', autocomplete: 'off', placeholder: opts.placeholder || 'اكتب للبحث...', role: 'combobox', 'aria-expanded': 'false' });
    var list = h('ul', { class: 'combo-list', role: 'listbox', hidden: true });
    var node = h('div', { class: 'combo' }, [input, list]);
    var prepared = items.map(function (it) { return { it: it, key: norm(it.label + ' ' + (it.sub || '')) }; });

    function find(q) {
      var toks = norm(q).split(/\s+/).filter(Boolean);
      var out = prepared.filter(function (p) { return toks.every(function (t) { return p.key.indexOf(t) >= 0; }); });
      var first = toks[0] || '';
      out.sort(function (a, b) {
        var sa = norm(a.it.label).indexOf(first) === 0 ? 0 : 1, sb = norm(b.it.label).indexOf(first) === 0 ? 0 : 1;
        return sa - sb;
      });
      return out.slice(0, 50).map(function (p) { return p.it; });
    }

    // allowNew: إن لم يجد المستخدم ما يريد يكتبه ويضيفه كعنصر جديد (يُضاف إلى القائمة عند الحفظ)
    function cleanTyped(t) { return String(t || '').replace(/\s+/g, ' ').trim(); }
    function withNew(list, q) {
      var t = cleanTyped(q);
      if (!opts.allowNew || !t) return list;
      var nt = norm(t);
      if (list.some(function (it) { return norm(it.label) === nt; })) return list;
      return list.concat([{ id: t, label: t, isNew: true }]);
    }
    function draw() {
      list.textContent = '';
      if (!matches.length) {
        list.appendChild(h('li', { class: 'none', text: 'لا نتائج' }));
      } else {
        matches.forEach(function (it, i) {
          var li = h('li', { class: (i === hot ? 'hot' : '') + (it.isNew ? ' add' : ''), role: 'option' }, [h('span', { text: it.isNew ? '+ إضافة «' + it.label + '» كخيار جديد' : it.label }), it.sub ? h('small', { text: it.sub }) : null]);
          li.addEventListener('mousedown', function (e) { e.preventDefault(); choose(it); });
          list.appendChild(li);
        });
      }
    }
    function show() {
      matches = withNew(find(input.value), input.value); hot = 0; open = true;
      list.hidden = false; input.setAttribute('aria-expanded', 'true'); draw();
    }
    function hide() { open = false; list.hidden = true; input.setAttribute('aria-expanded', 'false'); }
    function choose(it) {
      selected = it; input.value = it.label; hide();
      if (opts.onChange) opts.onChange(it.id);
    }
    function set(id) {
      var it = items.filter(function (x) { return x.id === id; })[0] || null;
      if (!it && id && opts.allowNew) it = { id: id, label: id, isNew: true };
      selected = it; input.value = it ? it.label : '';
    }

    input.addEventListener('focus', function () { input.select(); show(); });
    input.addEventListener('input', function () { selected = null; show(); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (!open || !matches.length) return;      // القائمة مغلقة: الأسهم تنقلك بين الخانات (يعالجها الحاوي)
        e.preventDefault();
        hot = Math.max(0, Math.min(matches.length - 1, hot + (e.key === 'ArrowDown' ? 1 : -1))); draw();
        var el = list.children[hot]; if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        if (open && matches[hot]) { e.preventDefault(); e.comboSelected = true; choose(matches[hot]); }
        else if (open) { e.preventDefault(); }
      } else if (e.key === 'Tab') {
        if (open && matches[hot] && input.value.trim() && !selected) choose(matches[hot]);
      } else if (e.key === 'Escape' && open) {
        e.stopPropagation(); hide();
      }
    });
    input.addEventListener('blur', function () {
      var typed = input.value.trim();
      if (!selected && typed) {
        // ما كتبه المستخدم لا يُمحى: نعتمد أول نتيجة مطابقة (أهم شيء في الهاتف حيث لا يوجد Enter)
        var m = find(typed);
        if (m.length) { hide(); choose(m[0]); return; }
        if (opts.allowNew) { hide(); choose({ id: cleanTyped(typed), label: cleanTyped(typed), isNew: true }); I.toast('«' + cleanTyped(typed) + '» عنصر جديد — سيُضاف إلى القائمة عند الحفظ', 'ok', 3000); return; }
        I.toast('«' + typed + '» غير موجود في القائمة — اختر من القائمة أو أضفه من «الإعدادات»', 'error', 4500);
      }
      hide();
      input.value = selected ? selected.label : '';
    });
    if (opts.value) set(opts.value);

    return {
      node: node, input: input,
      get: function () { return selected ? selected.id : ''; },
      set: set,
      focus: function () { input.focus(); }
    };
  }

  /* ---------- chips ---------- */
  // options: [{id, label}]  — نقرة واحدة، ويبقى الاختيار الأخير
  function chips(options, value, onChange, allowEmpty) {
    var cur = value || '';
    var wrap = h('div', { class: 'chips', role: 'radiogroup' });
    var btns = [];
    // لا نعيد إنشاء الأزرار عند النقر: استبدال الزر داخل <label> يجعل المتصفح يمرّر النقرة إلى أول زر فيعود الاختيار للأول
    function paint() {
      options.forEach(function (o, i) {
        var on = o.id === cur;
        btns[i].className = 'pill' + (o.title ? ' ico' : '') + (on ? ' on' : '');
        btns[i].setAttribute('aria-checked', String(on));
      });
    }
    options.forEach(function (o, i) {
      var b = h('button', {
        type: 'button', role: 'radio', 'aria-checked': 'false', class: 'pill', text: o.label, title: o.title || '', 'aria-label': o.title || o.label,
        onclick: function (e) {
          e.preventDefault(); e.stopPropagation();
          cur = (allowEmpty && cur === o.id) ? '' : o.id; paint(); if (onChange) onChange(cur);
        }
      });
      btns.push(b); wrap.appendChild(b);
    });
    paint();
    return { node: wrap, get: function () { return cur; }, set: function (v) { cur = v || ''; paint(); } };
  }

  /* ---------- date ---------- */
  function dateField(value) {
    var input = h('input', { type: 'date', value: value || isoDate(new Date()), required: true });
    function ago(n) { var d = new Date(); d.setDate(d.getDate() - n); input.value = isoDate(d); }
    var node = h('div', { class: 'date-row' }, [
      input,
      h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'اليوم', onclick: function () { ago(0); } }),
      h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'أمس', onclick: function () { ago(1); } })
    ]);
    return { node: node, input: input, get: function () { return input.value; }, set: function (v) { input.value = v; } };
  }

  /* ---------- المبلغ بالحروف (بالسنتيم) ---------- */
  var W_ONES = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
  var W_TENS = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
  var W_HUND = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];
  // ما دون الألف
  function below1000(n) {
    var parts = [], h = Math.floor(n / 100), r = n % 100;
    if (h) parts.push(W_HUND[h]);
    if (r) {
      if (r < 20) parts.push(W_ONES[r]);
      else { var o = r % 10, t = Math.floor(r / 10); parts.push(o ? W_ONES[o] + ' و' + W_TENS[t] : W_TENS[t]); }
    }
    return parts.join(' و');
  }
  // الجزء من العدد مع اسم مرتبته (ألف/مليون/مليار): 1 → «ألف»، 2 → «ألفان»، 3..10 → «ثلاثة آلاف»، غير ذلك «خمسة عشر ألف»
  var SCALES = [
    { one: 'ألف', two: 'ألفان', few: 'آلاف', many: 'ألف' },
    { one: 'مليون', two: 'مليونان', few: 'ملايين', many: 'مليون' },
    { one: 'مليار', two: 'ملياران', few: 'مليارات', many: 'مليار' }
  ];
  function numberWords(n) {
    n = Math.floor(Number(n));
    if (!isFinite(n) || n < 0) return '';
    if (n === 0) return 'صفر';
    var groups = [], x = n;
    while (x > 0) { groups.push(x % 1000); x = Math.floor(x / 1000); }
    if (groups.length > 4) return '';
    var out = [];
    for (var i = groups.length - 1; i >= 0; i--) {
      var g = groups[i];
      if (!g) continue;
      if (i === 0) { out.push(below1000(g)); continue; }
      var sc = SCALES[i - 1], w;
      if (g === 1) w = sc.one;
      else if (g === 2) w = sc.two;
      else if (g >= 3 && g <= 10) w = below1000(g) + ' ' + sc.few;
      else w = below1000(g) + ' ' + sc.many;
      out.push(w);
    }
    return out.join(' و');
  }
  function centimesWords(n) {
    var w = numberWords(n);
    if (!w) return '';
    if (n === 1) return 'سنتيم واحد';
    if (n === 2) return 'سنتيمان';
    if (n >= 3 && n <= 10) return w + ' سنتيمات';
    return w + ' سنتيم';
  }

  /* ---------- money ---------- */
  function groupDigits(intPart) { return intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function moneyField(value) {
    var input = h('input', { type: 'text', inputmode: 'decimal', autocomplete: 'off', placeholder: '0', required: true });
    var AR = '٠١٢٣٤٥٦٧٨٩';
    input.addEventListener('input', function () {
      var atEnd = input.selectionStart === input.value.length;
      var v = input.value.replace(/[٠-٩]/g, function (c) { return AR.indexOf(c); }).replace(/[,،٫]/g, '.').replace(/[^\d.]/g, '');
      var dot = v.indexOf('.');
      if (dot >= 0) v = v.slice(0, dot + 1) + v.slice(dot + 1).replace(/\./g, '').slice(0, 2);
      var parts = v.split('.');
      parts[0] = parts[0].replace(/^0+(?=\d)/, '');
      if (atEnd) input.value = groupDigits(parts[0]) + (parts.length > 1 ? '.' + parts[1] : '');
    });
    function get() { var n = Number(input.value.replace(/\s/g, '')); return isFinite(n) ? n : NaN; }
    // سطر يوضّح المبلغ بالسنتيم (1 دج = 100 سنتيم) ويتغير مع كل رقم يُكتب
    var cents = h('small', { class: 'cents', hidden: true });
    function showCents() {
      var n = get();
      if (!isFinite(n) || n <= 0 || input.value.trim() === '') { cents.hidden = true; cents.textContent = ''; return; }
      var c = Math.round(n * 100);
      cents.textContent = '\u2066' + groupDigits(String(c)) + '\u2069 سنتيم — ' + centimesWords(c);
      cents.hidden = false;
    }
    input.addEventListener('input', showCents);
    // صيغة مالية داخل الحقل: 15 000.00
    function fmt(n) { var p = (Math.round(n * 100) / 100).toFixed(2).split('.'); return groupDigits(p[0]) + '.' + p[1]; }
    function set(n) { input.value = (n === '' || n == null) ? '' : fmt(Number(n)); showCents(); }
    input.addEventListener('blur', function () {
      if (input.readOnly || input.value.trim() === '') return;
      var n = get(); if (isFinite(n)) { input.value = fmt(n); showCents(); }
    });
    if (value) set(value);
    return { node: h('div', { class: 'money' }, [input, cents]), input: input, get: get, set: set };
  }

  /* التنقل داخل لوحة الإدخال: ↑↓ بين الخانات، Enter للحفظ النهائي (onLast).
     داخل قائمة اختيار مفتوحة: الأسهم تتنقل بين الخيارات وEnter يختار ثم ينتقل للخانة التالية. */
  function enterNext(container, onLast) {
    function fields() {
      return Array.prototype.filter.call(container.querySelectorAll('input,select,textarea'), function (el) {
        return !el.disabled && !el.readOnly && el.type !== 'hidden' && el.type !== 'checkbox' && !el.closest('[hidden]');
      });
    }
    container.addEventListener('keydown', function (e) {
      var tag = e.target.tagName;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (e.defaultPrevented || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;
        var list = fields(), i = list.indexOf(e.target), n = list[i + (e.key === 'ArrowDown' ? 1 : -1)];
        if (i >= 0 && n) { e.preventDefault(); n.focus(); }
        return;
      }
      if (e.key !== 'Enter') return;
      if (tag === 'TEXTAREA' || tag === 'BUTTON') return;
      if (e.defaultPrevented && !e.comboSelected) return;
      e.preventDefault();
      if (e.comboSelected) {
        var l2 = fields(), j = l2.indexOf(e.target);
        if (j >= 0 && j < l2.length - 1) l2[j + 1].focus();
        return;
      }
      if (onLast) onLast(e);
    });
  }

  // الصيغة المالية الجزائرية: فراغ بين الآلاف + .00 دائمًا، والسالب بين قوسين (865 661.00)
  // والرقم كله معزول اتجاهيًا (LTR) حتى لا ينقلب داخل النص العربي
  function money(n, plus) {
    var v = Math.round((Number(n) || 0) * 100) / 100;
    var neg = v < 0; if (neg) v = -v;
    var p = v.toFixed(2).split('.');
    var out = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0') + '.' + p[1];
    return '\u2066' + (neg ? '(' + out + ')' : (plus && v > 0 ? '+' : '') + out) + '\u2069';
  }

  /* ---------- طباعة / PDF بشعار المكتب ----------
     spec: { title, ref, date, rows:[[تسمية، قيمة]], amount, amountLabel, table:{cols,rows}, note, signs:[تسميات] }
     تُبنى الوثيقة بعقد DOM (النص textContent) ثم تُطبع من إطار مخفي؛ ومن نافذة الطباعة يمكن «حفظ كـ PDF». */
  function logoUrl() {
    var el = document.querySelector('.logo-lockup'), bg = el ? window.getComputedStyle(el).backgroundImage : '';
    var m = /url\(["']?(.*?)["']?\)\s*$/.exec(bg || '');
    return m ? m[1] : '';
  }
  var PRINT_CSS = '@page{size:A4;margin:0}*{box-sizing:border-box}html,body{margin:0}body{font-family:\'Expo Arabic\',Tahoma,Arial,sans-serif;color:#1C1517;direction:rtl;font-size:13px;line-height:1.7}' +
    '.hd{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:3px solid #B01F2E;padding-bottom:12px}' +
    '.hd img{height:84px;width:auto}.hd .tt{text-align:left;direction:rtl}.hd .tt b{display:block;font-size:22px;color:#B01F2E}.hd .tt span{color:#6b5f5a;font-size:12px}' +
    '.meta{display:flex;justify-content:space-between;margin:16px 0;padding:10px 14px;background:#F6F3EF;border-radius:8px;font-size:12.5px}' +
    'table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid #DDD3CC;padding:7px 10px;text-align:right;vertical-align:top}th{background:#F1ECE7;font-size:12px}' +
    '.kv td:first-child{width:28%;background:#FAF6F2;font-weight:700}' +
    '.amt{margin:16px 0;border:2px solid #F27B2B;border-radius:10px;padding:12px 16px}.amt small{color:#6b5f5a}.amt b{display:block;font-size:24px;direction:ltr;text-align:right;unicode-bidi:isolate}' +
    '.sig{display:flex;gap:24px;margin-top:46px}.sig div{flex:1;border-top:1px solid #1C1517;padding-top:6px;text-align:center;font-size:12px;color:#4A3F3B}' +
    '.ft{margin-top:30px;border-top:1px solid #DDD3CC;padding-top:8px;font-size:11px;color:#8a7e78;display:flex;justify-content:space-between}' +
    '.neg{color:#B3261E}.num{direction:ltr;unicode-bidi:isolate;text-align:left}' +
    '.pg{width:100%;border-collapse:collapse;margin:0}.pg>thead>tr>td,.pg>tfoot>tr>td,.pg>tbody>tr>td{border:0;padding:0;background:none}.pg .sp{height:14mm}.pg>tbody>tr>td{padding:0 15mm}';
  function fontFaces() { var el = document.getElementById('fontFaces'); return el ? el.textContent : ''; }
  // اسم الملف المحمّل/المحفوظ كـ PDF: Inourar_المهندس_العنوان_التاريخ
  function fname(title, who) {
    var u = (I.user && I.user()) || {};
    var parts = ['Inourar', who || u.full_name || '', title || '', isoDate(new Date())];
    return parts.filter(Boolean).join('_').replace(/[\\/:*?"<>|\r\n]+/g, ' ').replace(/\s+/g, '_').slice(0, 120);
  }
  function printDoc(spec) {
    var kids = [];
    var logo = logoUrl();
    kids.push(h('div', { class: 'hd' }, [
      logo ? h('img', { src: logo, alt: 'INOURAR' }) : h('b', { text: 'INOURAR' }),
      h('div', { class: 'tt' }, [h('b', { text: spec.title || '' }), spec.ref ? h('span', { text: 'الرقم: ' + spec.ref }) : null])
    ]));
    kids.push(h('div', { class: 'meta' }, [
      h('span', { text: 'مكتب الدراسات المعمارية إينورار' }),
      h('span', { text: spec.date ? 'التاريخ: ' + spec.date : '' })
    ]));
    if (spec.rows && spec.rows.length) {
      kids.push(h('table', { class: 'kv' }, [h('tbody', {}, spec.rows.map(function (r) {
        return h('tr', {}, [h('td', { text: r[0] }), h('td', { text: r[1] || '—' })]);
      }))]));
    }
    if (typeof spec.amount === 'number') {
      var cents = Math.round(Math.abs(spec.amount) * 100);
      kids.push(h('div', { class: 'amt' }, [
        h('small', { text: spec.amountLabel || 'المبلغ' }),
        h('b', { text: money(spec.amount) + ' دج' }),
        h('small', { text: 'بالأحرف: ' + centimesWords(cents) })
      ]));
    }
    if (spec.table) {
      kids.push(h('table', {}, [
        h('thead', {}, [h('tr', {}, spec.table.cols.map(function (c) { return h('th', { text: c }); }))]),
        h('tbody', {}, spec.table.rows.map(function (r) {
          return h('tr', {}, r.map(function (c) {
            var o = (c && typeof c === 'object') ? c : { t: c };
            return h('td', { class: (o.num ? 'num ' : '') + (o.neg ? 'neg' : ''), text: o.t === undefined || o.t === null ? '' : String(o.t) });
          }));
        }))
      ]));
    }
    if (spec.note) kids.push(h('p', { text: 'ملاحظة: ' + spec.note }));
    if (spec.signs && spec.signs.length) kids.push(h('div', { class: 'sig' }, spec.signs.map(function (s) { return h('div', { text: s }); })));
    kids.push(h('div', { class: 'ft' }, [
      h('span', { text: 'صادر عن منصة INOURAR' }),
      h('span', { text: 'طُبع بتاريخ ' + new Date().toISOString().slice(0, 10) })
    ]));
    var wrap = h('div', {}, kids);
    var htmlDoc = '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>' + fname(spec.title || 'INOURAR', spec.who).replace(/[<>&]/g, '') +
      '</title><style>' + fontFaces() + PRINT_CSS + '</style></head><body><table class="pg"><thead><tr><td><div class="sp"></div></td></tr></thead><tbody><tr><td>' + wrap.innerHTML + '</td></tr></tbody><tfoot><tr><td><div class="sp"></div></td></tr></tfoot></table></body></html>';
    var fr = document.createElement('iframe');
    fr.setAttribute('aria-hidden', 'true');
    fr.style.cssText = 'position:fixed;inset-inline-end:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
    var fired = false;
    function go() {
      if (fired) return; fired = true;
      try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) { I.toast('تعذّرت الطباعة من هذا المتصفح', 'error'); }
      setTimeout(function () { if (fr.parentNode) fr.parentNode.removeChild(fr); }, 60000);
    }
    fr.addEventListener('load', function () {
      var f = fr.contentDocument && fr.contentDocument.fonts;
      if (f && f.ready) f.ready.then(function () { setTimeout(go, 150); }); else setTimeout(go, 600);
      setTimeout(go, 2500);
    });
    fr.srcdoc = htmlDoc;
    document.body.appendChild(fr);
    return htmlDoc;
  }

  // تصدير CSV يفتحه Excel مباشرة (UTF-8 مع BOM وفاصلة منقوطة)
  function exportCsv(name, cols, rows, who) {
    function cell(v) { var t = v === null || v === undefined ? '' : String(v); return '"' + t.replace(/"/g, '""') + '"'; }
    var text = '\uFEFF' + [cols].concat(rows).map(function (r) { return r.map(cell).join(';'); }).join('\r\n');
    try {
      var blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var fn = fname(name, who); a.href = url; a.download = fn + '.csv'; a.style.display = 'none';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 3000);
      I.toast('جارٍ تنزيل الملف: ' + fn + '.csv', 'ok', 2500);
    } catch (e) { I.toast('تعذّر التصدير من هذا المتصفح', 'error'); }
  }

  /* ---------- شريط الفلاتر: يحفظ قيمه في store فلا تضيع عند إعادة رسم الشاشة ---------- */
  // defs: [{key, type:'search'|'select'|'date', label, options:[{id,label}], all}]
  function filterBar(defs, store, onChange, extra) {
    var els = {};
    var node = h('div', { class: 'filters' });
    function fire() { defs.forEach(function (d) { store[d.key] = els[d.key].value; }); onChange(store); }
    defs.forEach(function (d) {
      var el;
      if (d.type === 'select') {
        el = h('select', {}, [h('option', { value: '', text: d.all || 'الكل' })].concat((d.options || []).map(function (o) { return h('option', { value: o.id, text: o.label }); })));
        el.addEventListener('change', fire);
      } else if (d.type === 'date') {
        el = h('input', { type: 'date' });
        el.addEventListener('change', fire);
      } else {
        el = h('input', { type: 'search', placeholder: d.placeholder || 'بحث...' });
        el.addEventListener('input', fire);
      }
      el.value = store[d.key] || '';
      els[d.key] = el;
      node.appendChild(h('label', { class: 'flt' + (d.type === 'search' ? ' flt-wide' : '') }, [h('span', { class: 'muted', text: d.label }), el]));
    });
    (extra || []).forEach(function (x) { node.appendChild(x); });
    node.appendChild(h('button', { type: 'button', class: 'btn btn-ghost btn-sm flt-clear', text: 'مسح الفلاتر', onclick: function () {
      defs.forEach(function (d) { els[d.key].value = ''; }); fire();
    } }));
    function describe() {
      var out = [];
      defs.forEach(function (d) {
        var v = els[d.key].value; if (!v) return;
        var t = v;
        if (d.type === 'select') { var o = (d.options || []).filter(function (x) { return x.id === v; })[0]; t = o ? o.label : v; }
        out.push(d.label + ': ' + t);
      });
      return out.join(' — ') || 'بلا فلاتر (الكل)';
    }
    return { node: node, describe: describe, store: store };
  }
  function inRange(d, from, to) { return (!from || d >= from) && (!to || d <= to); }
  function uniq(items, getter) {
    var seen = {}, out = [];
    items.forEach(function (x) { var v = getter(x); if (v && !seen[v]) { seen[v] = 1; out.push({ id: v, label: v }); } });
    return out.sort(function (a, b) { return a.label < b.label ? -1 : 1; });
  }
  // طباعة قائمة مفلترة: spec {title, filters, cols, rows, total, totalLabel, signs}
  function printList(spec) {
    printDoc({
      title: spec.title, who: spec.who, date: isoDate(new Date()),
      rows: [['الفلاتر', spec.filters || 'بلا فلاتر'], ['عدد السطور', String(spec.rows.length)]],
      amount: typeof spec.total === 'number' ? spec.total : undefined, amountLabel: spec.totalLabel,
      table: { cols: spec.cols, rows: spec.rows }, signs: spec.signs
    });
  }

  I.ui = { today: function () { return isoDate(new Date()); }, fname: fname, filterBar: filterBar, inRange: inRange, uniq: uniq, printList: printList, exportCsv: exportCsv, print: printDoc, money: money, numberWords: numberWords, centimesWords: centimesWords, enterNext: enterNext, combo: combo, chips: chips, dateField: dateField, moneyField: moneyField, norm: norm };
})();
</script>

<script>
(function () {
  'use strict';
  var I = window.INOURAR, h = I.h;

  var WEEKDAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  var MONTHS = ['جانفي', 'فيفري', 'مارس', 'أفريل', 'ماي', 'جوان', 'جويلية', 'أوت', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];

  function dateLine(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    if (!m) return '';
    var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return WEEKDAYS[d.getUTCDay()] + ' ' + (+m[3]) + ' ' + MONTHS[+m[2] - 1] + ' ' + m[1];
  }

  function greeting(iso) {
    return 'مرحبًا ' + I.user().full_name;
  }

  function kpi(opts) {
    var v = h('b', { 'data-count': String(opts.value), 'data-fmt': opts.fmt || 'money', text: opts.fmt === 'int' ? String(opts.value) : I.ui.money(opts.value) });
    return h('div', { class: 'kpi' + (opts.hero ? ' hero' : '') }, [
      h('div', { class: 'kpi-top' }, [
        h('span', { text: opts.label }),
        opts.hero ? I.icon(opts.icon, 22) : h('span', { class: 'kpi-ic ' + opts.tone }, [I.icon(opts.icon, 20)])
      ]),
      h('div', { class: 'kpi-v' }, [v, opts.unit ? h('small', { text: opts.unit }) : null]),
      h('div', { class: 'kpi-note', text: opts.note || '' })
    ]);
  }

  function chart(d, admin) {
    var max = 1;
    d.series.forEach(function (s) { max = Math.max(max, s.spent, admin ? s.received : 0); });
    function bar(val, color, label) {
      var pct = Math.max(1.5, Math.round(val * 1000 / max) / 10);
      return h('div', { class: 'bar', style: 'height:' + pct + '%;background:' + color, title: label + ': ' + I.ui.money(val) + ' دج' });
    }
    var cols = d.series.map(function (s) {
      var kids = [];
      if (admin) kids.push(bar(s.received, '#17A085', 'مقبوضات'));
      kids.push(bar(s.spent, '#F27B2B', 'مصاريف'));
      return h('div', { class: 'col' }, kids);
    });
    var legend = [h('span', {}, [h('i', { style: 'background:#F27B2B' }), 'مصاريف'])];
    if (admin) legend.unshift(h('span', {}, [h('i', { style: 'background:#17A085' }), 'مقبوضات']));
    return h('div', { class: 'panel-card wide' }, [
      h('div', { class: 'panel-head' }, [
        h('div', {}, [h('h3', { text: admin ? 'المقبوضات والمصاريف' : 'مصاريفي' }), h('span', { class: 'muted', text: 'آخر 6 أشهر' })]),
        h('div', { class: 'legend' }, legend)
      ]),
      h('div', { class: 'chart', role: 'img', 'aria-label': 'رسم بياني للأشهر الستة الأخيرة' }, cols),
      h('div', { class: 'chart-x' }, d.series.map(function (s) { return h('span', { text: s.label }); }))
    ]);
  }

  function alerts(d) {
    var kids = [h('div', { class: 'panel-head' }, [h('h3', { text: 'تنبيهات تحتاج انتباهك' })])];
    if (!d.alerts.length) {
      kids.push(h('div', { class: 'all-clear' }, [I.icon('check', 20), 'لا توجد تنبيهات الآن']));
    } else {
      d.alerts.forEach(function (a) {
        kids.push(h('div', { class: 'alert-row ' + a.level }, [
          h('span', { class: 'dot' }),
          h('div', {}, [h('b', { text: a.title }), h('small', { text: a.text })]),
          a.amount === null || a.amount === undefined ? null : h('span', { class: 'amt', text: I.ui.money(a.amount) + ' دج' })
        ]));
      });
    }
    return h('div', { class: 'panel-card' }, kids);
  }

  function projects(d, admin) {
    var head = h('div', { class: 'prj-row head' }, ['المشروع', 'المرحلة', 'المصاريف', admin ? 'المقبوضات' : 'البلدية', 'التقدم'].map(function (t) { return h('span', { text: t }); }));
    var rows = d.recent.map(function (p) {
      return h('button', { type: 'button', class: 'prj-row', onclick: function () { I.openModule('projects'); } }, [
        h('span', { class: 'nm' }, [h('b', { text: p.name }), h('small', { text: p.id + (p.engineer && admin ? ' · ' + p.engineer : '') })]),
        h('span', {}, [h('span', { class: 'stage-badge', text: p.stage })]),
        h('span', { class: 'm', text: I.ui.money(p.spent) }),
        admin ? h('span', { class: 'm', text: I.ui.money(p.received) }) : h('span', { text: p.commune || '—' }),
        h('span', { class: 'prog' }, [
          h('span', { class: 'trk' }, [h('span', { class: 'fil', style: 'width:' + p.pct + '%' })]),
          h('b', { text: p.pct + '%' })
        ])
      ]);
    });
    var inner = h('div', {}, [head].concat(rows.length ? rows : [h('div', { class: 'empty', text: 'لا توجد مشاريع بعد' })]));
    return h('div', { class: 'panel-card', style: 'margin-bottom:0' }, [
      h('div', { class: 'panel-head' }, [h('h3', { text: 'المشاريع الأخيرة' }),
        h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'عرض الكل', onclick: function () { I.openModule('projects'); } })]),
      h('div', { class: 'prj-scroll' }, [inner])
    ]);
  }


  // إشعارات المهندس: قرارات المكتب على طلباته (قبول → تأكيد الاستلام)
  var noticeListener = null;
  function noticeBox() {
    var box = h('div', { class: 'notices' });
    function paint() {
      box.textContent = '';
      I.notif.get().decided.forEach(function (x) {
        var ok = x.status === 'APPROVED';
        var kids = [
          h('span', { class: 'grow' }, [h('b', { text: ok ? '✓ قُبل طلبك — ' + I.ui.money(x.amount) + ' دج أُضيفت إلى صندوقك' : 'رُفض طلبك — ' + I.ui.money(x.amount) + ' دج' }), x.reason ? h('small', { text: ' ' + x.reason }) : null])
        ];
        kids.push(h('button', { type: 'button', class: 'btn btn-primary btn-sm', text: ok ? 'تأكيد الاستلام' : 'حسنًا', onclick: function (e) {
          var b = e.currentTarget; b.disabled = true;
          I.rpc('transfers.ack', { ids: [x.id] }, { mode: 'silent' }).then(function () { I.toast(ok ? '✓ تم تأكيد الاستلام' : 'تم', 'ok', 2500); I.notif.refresh(); }).catch(function (err) { b.disabled = false; I.toast(err.message || 'حدث خطأ', 'error'); });
        } }));
        box.appendChild(h('div', { class: 'notice ' + (ok ? 'ok' : 'bad') }, kids));
      });
    }
    if (noticeListener) I.notif.off(noticeListener);
    noticeListener = paint; I.notif.on(paint);
    paint();
    return box;
  }

  function engineerTop(d) {
    function go(tab, action) { I.pending.caisses = { tab: tab, action: action || '' }; I.openModule('caisses'); }
    return h('section', {}, [
      noticeBox(),
      h('div', { class: 'hero-ing' }, [
        h('button', { type: 'button', class: 'big-card in', onclick: function () { go('mine', 'request'); } }, [h('span', { class: 't', text: 'المداخيل (المستلم)' }), h('span', { class: 'v', text: I.ui.money(d.mine.received) }), h('span', { class: 'hint', text: '+ اضغط لطلب مبلغ' })]),
        h('button', { type: 'button', class: 'big-card out', onclick: function () { go('charges'); } }, [h('span', { class: 't', text: 'المصاريف' }), h('span', { class: 'v', text: I.ui.money(d.mine.spent) }), h('span', { class: 'hint', text: '+ اضغط لإضافة مصروف' })]),
        h('div', { class: 'balline' }, ['رصيد صندوقي: ', h('span', { class: d.mine.balance < 0 ? 'neg' : '', text: I.ui.money(d.mine.balance) + ' دج' })])
      ])
    ]);
  }

  function draw(root, d, enter) {
    root.classList.toggle('static', !enter);
    var admin = d.role === 'DG' || d.role === 'RESP';
    var kp = [];
    if (admin) {
      kp.push(kpi({ hero: true, label: 'رصيد الصندوق المركزي', icon: 'caisses', value: d.central.balance, unit: 'دج', note: 'محسوب من الدفعات والتحويلات المعتمدة' }));
    }
    kp.push(kpi({ label: admin ? 'المشاريع الجارية' : 'مشاريعي', icon: 'projects', tone: 'c-orange', value: d.projects.active, fmt: 'int',
      note: d.projects.in_progress + ' منها في مرحلة الأشغال' }));
    kp.push(kpi({ label: admin ? 'طلبات بانتظار الموافقة' : 'طلباتي قيد الموافقة', icon: 'clock', tone: 'c-red', value: d.pending.count, fmt: 'int',
      note: d.pending.count ? 'بقيمة ' + I.ui.money(d.pending.amount) + ' دج' : 'لا شيء معلّق' }));
    kp.push(kpi({ label: 'مصاريف الشهر', icon: 'finance', tone: 'c-green', value: d.month.spent, unit: 'دج',
      note: 'الشهر الماضي: ' + I.ui.money(d.month.prev_spent) }));

    root.textContent = '';
    root.appendChild(h('div', { class: 'dash-head' }, [
      h('h2', { text: greeting(d.today) }),
      h('span', { class: 'muted', text: dateLine(d.today) + ' · هذا ملخص نشاط ' + (admin ? 'المكتب' : 'مشاريعك') })
    ]));
    if (!admin) root.appendChild(engineerTop(d));
    root.appendChild(h('section', { class: 'kpis' }, kp));
    root.appendChild(h('section', { class: 'dash-grid' }, [chart(d, admin), alerts(d)]));
    root.appendChild(projects(d, admin));
  }

  function skeleton(root) {
    root.textContent = '';
    root.appendChild(h('div', { class: 'dash-head' }, [h('h2', { text: greeting() })]));
    var cards = [];
    for (var i = 0; i < 4; i++) cards.push(h('div', { class: 'skel-row' }));
    root.appendChild(h('div', { class: 'dash-skel', 'aria-hidden': 'true' }, cards));
  }

  function clientHome(root) {
    root.textContent = '';
    root.appendChild(h('div', { class: 'dash-head' }, [
      h('h2', { text: greeting() }),
      h('span', { class: 'muted', text: 'ستظهر هنا مشاريعك ودفعاتك عند تفعيل بوابة الزبون.' })
    ]));
  }

  function render(root) {
    if (I.user().role === 'CLIENT') { clientHome(root); return; }
    var enter = I.takeEntering();
    if (enter || !root.querySelector('.kpis')) skeleton(root);
    I.refresher(function () { render(root); });
    I.rpc('dashboard.summary').then(function (d) { draw(root, d, enter); })
      .catch(function (err) { I.toast(err.message || 'حدث خطأ', 'error'); });
  }

  I.setHome(render);
})();
</script>

<script>
(function () {
  'use strict';
  var I = window.INOURAR, h = I.h;

  I.register('settings', {
    title: 'الإعدادات',
    render: function (body) {
      var state = { defs: [], current: null, items: [], q: '' };
      var pills = h('div', { class: 'pills' });
      var area = h('div', {});
      var tbody = null;

      body.appendChild(h('p', {
        class: 'muted',
        text: 'عدّل القوائم المستعملة في النماذج. لا يوجد حذف: العنصر المعطَّل يختفي من الاختيارات وتبقى العمليات القديمة سليمة.'
      }));
      body.appendChild(pills);
      body.appendChild(area);

      function fail(err) { I.toast(err.message || 'حدث خطأ', 'error'); }

      function renderPills() {
        pills.textContent = '';
        state.defs.forEach(function (d) {
          pills.appendChild(h('button', {
            type: 'button',
            class: 'pill' + (d.key === state.current ? ' on' : ''),
            text: d.title + ' (' + d.active + ')',
            onclick: function () { state.current = d.key; state.q = ''; renderPills(); loadItems(); }
          }));
        });
      }

      function refreshDefs() {
        return I.rpc('lists.defs').then(function (d) { state.defs = d; renderPills(); });
      }

      function loadItems() {
        area.textContent = '';
        return I.rpc('lists.items', { list: state.current }).then(function (items) {
          state.items = items;
          renderArea();
        }).catch(fail);
      }

      function replaceItem(item) {
        state.items = state.items.map(function (x) { return x.id === item.id ? item : x; });
        renderRows();
        refreshDefs();
      }

      function renameItem(item) {
        var input = h('input', { type: 'text', value: item.label, maxlength: '120', required: true });
        I.modal({
          title: 'إعادة تسمية',
          content: I.field('الاسم', input),
          onSubmit: function () {
            return I.rpc('lists.update', { id: item.id, label: input.value }).then(function (u) {
              replaceItem(u); I.toast('تم الحفظ');
            });
          }
        });
      }

      function toggleItem(item) {
        replaceItem(Object.assign({}, item, { active: !item.active }));
        I.rpc('lists.update', { id: item.id, active: !item.active }, { mode: 'quiet' }).then(replaceItem).catch(function (e) { replaceItem(item); fail(e); });
      }

      function renderRows() {
        var q = state.q.trim().toLowerCase();
        var rows = state.items.filter(function (it) { return !q || it.label.toLowerCase().indexOf(q) >= 0; });
        tbody.textContent = '';
        if (!rows.length) {
          tbody.appendChild(h('tr', {}, [h('td', { colspan: '3', class: 'empty', text: 'لا توجد عناصر' })]));
          return;
        }
        rows.forEach(function (it) {
          tbody.appendChild(h('tr', { class: it.active ? '' : 'off' }, [
            h('td', { text: it.label }),
            h('td', {}, [h('span', { class: 'badge ' + (it.active ? 'ok' : ''), text: it.active ? 'مفعّل' : 'معطَّل' })]),
            h('td', { class: 'actions' }, [
              h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'إعادة تسمية', onclick: function () { renameItem(it); } }),
              h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: it.active ? 'تعطيل' : 'تفعيل', onclick: function () { toggleItem(it); } })
            ])
          ]));
        });
      }

      function pasteList() {
        var ta = h('textarea', { rows: '10', placeholder: 'ألصق هنا نصًّا من ملف (Excel أو Word أو ملاحظات)، كل عنصر في سطر.\nمثال:\nإسمنت\nحديد 12\nرمل', style: 'width:100%' });
        var info = h('div', { class: 'muted' });
        var upd = function () {
          var n = ta.value.split(/\r?\n|\t|؛|;/).filter(function (x) { return x.trim(); }).length;
          info.textContent = n ? ('عدد الأسطر: ' + n + ' — المكرَّر والموجود مسبقًا يُتجاهل') : 'الحد الأقصى 1000 سطر في المرة';
        };
        ta.oninput = upd; upd();
        var title = (state.defs.filter(function (d) { return d.key === state.current; })[0] || {}).title || '';
        I.modal({
          title: 'لصق قائمة في «' + title + '»',
          content: h('div', {}, [ta, info]),
          submitLabel: 'إضافة العناصر',
          onSubmit: function () {
            return I.rpc('lists.addMany', { list: state.current, text: ta.value }).then(function (r) {
              r.added.forEach(function (it) { state.items.push(it); });
              renderRows(); refreshDefs();
              I.toast('أُضيف ' + r.added.length + ' عنصرًا' + (r.skipped ? ' — تُجوهل ' + r.skipped + ' مكرَّرًا' : '') + (r.tooLong ? ' — ' + r.tooLong + ' سطرًا أطول من 120 حرفًا' : ''));
            });
          }
        });
      }

      function renderArea() {
        area.textContent = '';
        var search = h('input', {
          type: 'search', placeholder: 'بحث في القائمة...', value: state.q,
          oninput: function (e) { state.q = e.target.value; renderRows(); }
        });
        var addInput = h('input', { type: 'text', placeholder: 'عنصر جديد...', maxlength: '120' });
        var addForm = h('form', {
          class: 'toolbar',
          onsubmit: function (ev) {
            ev.preventDefault();
            if (!addInput.value.trim()) return;
            I.rpc('lists.add', { list: state.current, label: addInput.value }).then(function (item) {
              state.items.push(item); addInput.value = ''; renderRows(); refreshDefs(); I.toast('تمت الإضافة');
            }).catch(fail);
          }
        }, [addInput, h('button', { class: 'btn btn-primary', type: 'submit', text: 'إضافة' })]);

        var pasteBtn = h('button', { type: 'button', class: 'btn btn-ghost', text: '📋 لصق قائمة', onclick: pasteList });
        tbody = h('tbody', {});
        area.appendChild(h('div', { class: 'toolbar' }, [search, pasteBtn]));
        area.appendChild(addForm);
        area.appendChild(h('div', { class: 'table-wrap' }, [
          h('table', {}, [
            h('thead', {}, [h('tr', {}, [h('th', { text: 'الاسم' }), h('th', { text: 'الحالة' }), h('th', { text: 'إجراءات' })])]),
            tbody
          ])
        ]));
        renderRows();
      }

      // بطاقة البيانات التجريبية (للمدير العام فقط)
      if (I.user().role === 'DG') {
        var demoBox = h('div', { class: 'panel' });
        body.appendChild(demoBox);
        var drawDemo = function (st) {
          demoBox.textContent = '';
          demoBox.appendChild(h('h4', { text: 'بيانات تجريبية مؤقتة' }));
          if (!st.seeded) {
            demoBox.appendChild(h('p', { class: 'muted', text: 'تضيف 3 زبائن و4 مشاريع وحسابين لمهندسين وحساب زبون، مع دفعات وتحويلات ومصاريف، لتجربة المنصة بشكل قريب من الواقع. يمكن حذفها كلها لاحقًا بنقرة واحدة دون المساس ببياناتك الحقيقية.' }));
            demoBox.appendChild(h('div', {}, [h('button', { type: 'button', class: 'btn btn-primary', text: 'إضافة البيانات التجريبية', onclick: function (ev) {
              ev.target.disabled = true; ev.target.textContent = 'جاري الإضافة... قد يستغرق دقيقة';
              I.rpc('demo.seed').then(function (s) { drawDemo(s); I.toast('أُضيفت البيانات التجريبية'); }).catch(function (e) { ev.target.disabled = false; ev.target.textContent = 'إضافة البيانات التجريبية'; fail(e); });
            } })]));
          } else {
            var c = st.counts;
            demoBox.appendChild(h('p', { text: 'البيانات التجريبية موجودة: ' + c.Clients + ' زبائن، ' + c.Projects + ' مشاريع، ' + c.Versements + ' دفعات، ' + c.Transferts + ' تحويلات، ' + c.Charges + ' مصروفًا، ' + c.Users + ' حسابات.' }));
            demoBox.appendChild(h('p', { class: 'muted', text: 'حسابات التجربة: demo_ing1 و demo_ing2 (مهندسان) و demo_client1 (زبون) — كلمة السر: ' + st.password }));
            demoBox.appendChild(h('div', {}, [h('button', { type: 'button', class: 'btn btn-ghost', text: 'حذف كل البيانات التجريبية', onclick: function () {
              I.modal({
                title: 'حذف البيانات التجريبية',
                content: h('p', { text: 'سيُحذف كل ما أُضيف كبيانات تجريبية فقط (زبائن DEMO ومشاريعهم ودفعاتهم وتحويلاتهم ومصاريفهم وحسابات demo). بياناتك الحقيقية لا تُمس.' }),
                submitLabel: 'نعم، احذفها',
                onSubmit: function () { return I.rpc('demo.remove').then(function () { drawDemo({ seeded: false }); I.toast('حُذفت البيانات التجريبية'); }); }
              });
            } })]));
          }
        };
        I.rpc('demo.status').then(drawDemo).catch(fail);
      }

      I.refresher(function () { loadItems(); });
      refreshDefs().then(function () {
        if (state.defs.length) { state.current = state.defs[0].key; renderPills(); return loadItems(); }
      }).catch(fail);
    }
  });
})();
</script>

<script>
(function () {
  'use strict';
  var I = window.INOURAR, h = I.h;

  I.register('clients', {
    title: 'الزبائن',
    render: function (body) {
      var state = { items: [], q: '', showOff: false };
      var tbody = h('tbody', {});
      var count = h('span', { class: 'muted' });

      function fail(err) { I.toast(err.message || 'حدث خطأ', 'error'); }

      function replaceItem(c) {
        state.items = state.items.map(function (x) { return x.id === c.id ? c : x; });
        renderRows();
      }

      function openForm(c) {
        var isNew = !c;
        c = c || { kind: 'PERSON', first_name: '', last_name: '', company_name: '', nickname: '', phone: '', whatsapp: '', address: '', notes: '' };
        var company = h('input', { type: 'text', value: c.company_name, maxlength: '120' });
        var first = h('input', { type: 'text', value: c.first_name, maxlength: '60', placeholder: 'Kacem', dir: 'ltr', autocapitalize: 'words', required: true });
        var last = h('input', { type: 'text', value: c.last_name, maxlength: '60', placeholder: 'Rai', dir: 'ltr', autocapitalize: 'words', required: true });
        var wa = h('input', { type: 'tel', value: c.whatsapp, placeholder: '0550123456', dir: 'ltr', required: true });
        var phone = h('input', { type: 'tel', value: c.phone, placeholder: 'اختياري', dir: 'ltr' });
        var nick = h('input', { type: 'text', value: c.nickname, maxlength: '60', placeholder: 'اختياري' });
        var addr = h('input', { type: 'text', value: c.address, maxlength: '200' });
        var notes = h('textarea', { maxlength: '500', value: c.notes });
        var companyFld = I.field('اسم الشركة *', company);
        var typeBox = I.ui.chips([{ id: 'PERSON', label: 'زبون' }, { id: 'COMPANY', label: 'شركة' }], c.kind === 'COMPANY' ? 'COMPANY' : 'PERSON', function () { paintKind(); });
        function paintKind() { var co = typeBox.get() === 'COMPANY'; companyFld.hidden = !co; company.required = co; }
        var content = h('div', { class: 'login-card', style: 'gap:12px;max-width:none' }, [
          h('div', { class: 'inl' }, [h('span', { class: 'lbl', text: 'النوع' }), typeBox.node]),
          companyFld,
          I.field((typeBox.get() === 'COMPANY' ? 'اسم المسؤول' : 'الاسم') + ' (بالأحرف اللاتينية) *', first),
          I.field('اللقب (بالأحرف اللاتينية) *', last),
          I.field('واتساب *', wa),
          I.field('هاتف احتياطي', phone),
          I.field('الكنية (Nickname)', nick),
          I.field('العنوان', addr),
          I.field('ملاحظات', notes)
        ]);
        paintKind();
        I.modal({
          title: isNew ? 'زبون جديد' : 'تعديل الزبون',
          content: content,
          onSubmit: function () {
            var data = { kind: typeBox.get(), company_name: company.value, first_name: first.value, last_name: last.value, whatsapp: wa.value, phone: phone.value, nickname: nick.value, address: addr.value, notes: notes.value };
            if (isNew) {
              return I.rpc('clients.create', data).then(function (created) {
                state.items.push(created); renderRows(); I.toast('تمت إضافة الزبون');
              });
            }
            data.id = c.id;
            return I.rpc('clients.update', data).then(function (u) { replaceItem(u); I.toast('تم الحفظ'); });
          }
        });
      }

      function toggle(c) {
        replaceItem(Object.assign({}, c, { active: !c.active }));          // يظهر التغيير فورًا ويُؤكَّد من الخادم في الخلفية
        I.rpc('clients.setActive', { id: c.id, active: !c.active }, { mode: 'quiet' }).then(replaceItem).catch(function (e) { replaceItem(c); fail(e); });
      }

      function visible() {
        var q = state.q.trim().toLowerCase();
        return state.items.filter(function (c) {
          if (!state.showOff && !c.active) return false;
          if (state.noPhone && c.whatsapp) return false;
          return !q || (c.name + ' ' + c.nickname + ' ' + c.company_name).toLowerCase().indexOf(q) >= 0 || String(c.whatsapp).indexOf(q) >= 0 || String(c.phone).indexOf(q) >= 0;
        });
      }
      function renderRows() {
        var rows = visible();
        count.textContent = rows.length + ' زبونًا';
        tbody.textContent = '';
        if (!rows.length) {
          tbody.appendChild(h('tr', {}, [h('td', { colspan: '5', class: 'empty', text: 'لا يوجد زبائن مطابقون' })]));
          return;
        }
        rows.forEach(function (c) {
          tbody.appendChild(h('tr', { class: c.active ? '' : 'off' }, [
            h('td', {}, [
              h('b', { text: c.name }),
              c.kind === 'COMPANY' && (c.first_name || c.last_name) ? h('div', { class: 'muted', text: [c.first_name, c.last_name].filter(Boolean).join(' ') }) : null,
              (c.whatsapp || c.phone) ? h('div', { class: 'muted', dir: 'ltr', style: 'text-align:right', text: c.whatsapp || c.phone }) : null,
              c.whatsapp ? null : h('span', { class: 'badge warn', text: 'أكمل الواتساب' })
            ]),
            h('td', { text: c.nickname }),
            h('td', { text: c.address }),
            h('td', {}, [h('span', { class: 'badge ' + (c.active ? 'ok' : ''), text: c.active ? 'مفعّل' : 'معطَّل' })]),
            h('td', { class: 'actions' }, [
              h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'تعديل', onclick: function () { openForm(c); } }),
              h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: c.active ? 'تعطيل' : 'تفعيل', onclick: function () { toggle(c); } })
            ])
          ]));
        });
      }

      var search = h('input', {
        type: 'search', placeholder: 'بحث بالاسم أو الكنية أو الهاتف...',
        oninput: function (e) { state.q = e.target.value; renderRows(); }
      });
      var showOff = h('input', {
        type: 'checkbox',
        onchange: function (e) { state.showOff = e.target.checked; renderRows(); }
      });

      body.appendChild(h('div', { class: 'toolbar' }, [
        search,
        h('label', { class: 'check' }, [showOff, 'إظهار المعطَّلين']),
        h('label', { class: 'check' }, [h('input', { type: 'checkbox', onchange: function (e) { state.noPhone = e.target.checked; renderRows(); } }), 'ناقصو الواتساب فقط']),
        h('span', { class: 'spacer' }),
        count,
        h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'طباعة / PDF', onclick: function () {
          var rows = visible();
          I.ui.printList({ title: 'قائمة الزبائن', filters: (state.q ? 'بحث: ' + state.q + ' — ' : '') + (state.noPhone ? 'ناقصو الواتساب فقط — ' : '') + (state.showOff ? 'مع المعطَّلين' : 'النشطون فقط'),
            cols: ['الاسم واللقب', 'الكنية', 'واتساب', 'العنوان'], rows: rows.map(function (c) { return [c.name, c.nickname || '', c.whatsapp || '—', c.address || '']; }), signs: ['أُعدّ بواسطة', 'المدير العام'] });
        } }),
        h('button', { class: 'btn btn-primary', type: 'button', text: '+ زبون جديد', onclick: function () { openForm(null); } })
      ]));
      body.appendChild(h('div', { class: 'table-wrap' }, [
        h('table', {}, [
          h('thead', {}, [h('tr', {}, ['الاسم واللقب', 'الكنية', 'العنوان', 'الحالة', 'إجراءات'].map(function (t) { return h('th', { text: t }); }))]),
          tbody
        ])
      ]));

      function load() { I.rpc('clients.list').then(function (items) { state.items = items; renderRows(); }).catch(fail); }
      I.refresher(function () { load(); });
      load();
    }
  });
})();
</script>

<script>
(function () {
  'use strict';
  var I = window.INOURAR, h = I.h;

  I.register('projects', {
    title: 'المشاريع',
    render: function (body) {
      var isAdmin = I.user().role === 'DG' || I.user().role === 'RESP';
      var state = { items: [], opts: null, showOff: false };
      var F = {}, fb = null, U = I.ui;
      var tbody = h('tbody', {});
      var count = h('span', { class: 'muted' });

      function fail(err) { I.toast(err.message || 'حدث خطأ', 'error'); }

      function select(options, value, placeholder) {
        var s = h('select', {});
        if (placeholder !== undefined) s.appendChild(h('option', { value: '', text: placeholder }));
        options.forEach(function (o) {
          var val = typeof o === 'string' ? o : o.id, txt = typeof o === 'string' ? o : o.name;
          s.appendChild(h('option', { value: val, text: txt }));
        });
        s.value = value || '';
        return s;
      }

      function replaceItem(p) {
        var found = false;
        state.items = state.items.map(function (x) { if (x.id === p.id) { found = true; return p; } return x; });
        if (!found) state.items.unshift(p);
        renderRows();
      }

      /* ---------- نموذج إنشاء / تعديل ---------- */
      function openForm(p) {
        I.rpc('projects.options').then(function (o) { state.opts = o; openFormNow(p); }).catch(fail);
      }

      function openFormNow(p) {
        var isNew = !p, o = state.opts;
        p = p || { client_id: '', site: '', commune: '', type: '', initial_path: 'Réalisation', engineer_id: '' };
        var client = isNew ? I.ui.combo(o.clients.map(function (c) { return { id: c.id, label: c.name }; }), { value: p.client_id, placeholder: 'اكتب اسم الزبون...' }) : h('input', { type: 'text', value: p.client_name, disabled: true });
        var site = h('input', { type: 'text', value: p.site, maxlength: '100', required: true, placeholder: 'مثال: حي محمود' });
        var OTHER = '__other__';
        var communeSel = h('select', {});
        o.communes.forEach(function (c) { communeSel.appendChild(h('option', { value: c, text: c })); });
        communeSel.appendChild(h('option', { value: OTHER, text: 'أخرى (اكتبها)...' }));
        var communeTxt = h('input', { type: 'text', maxlength: '60', placeholder: 'اسم البلدية', hidden: true });
        var commune = { get value() { return communeSel.value === OTHER ? communeTxt.value : communeSel.value; } };
        if (p.commune && o.communes.indexOf(p.commune) >= 0) communeSel.value = p.commune;
        else if (p.commune) { communeSel.value = OTHER; communeTxt.value = p.commune; communeTxt.hidden = false; }
        else communeSel.value = o.communes.length ? o.communes[0] : OTHER;
        if (communeSel.value === OTHER) communeTxt.hidden = false;
        communeSel.addEventListener('change', function () {
          communeTxt.hidden = communeSel.value !== OTHER;
          if (!communeTxt.hidden) communeTxt.focus();
        });
        var communeNode = h('div', { style: 'display:flex;flex-direction:column;gap:8px' }, [communeSel, communeTxt]);
        var type = I.ui.chips(o.types.map(function (t) { return { id: t, label: t }; }), p.type);
        var path = I.ui.chips(o.paths.map(function (x) { return { id: x, label: x }; }), p.initial_path);
        var eng = o.engineers.length ? I.ui.combo(o.engineers.map(function (e) { return { id: e.id, label: e.name }; }), { value: p.engineer_id, placeholder: 'المهندس (اختياري)...' }) : null;
        var rows = [
          I.field('الزبون *', isNew ? client.node : client),
          I.field('الموقع / الحي *', site),
          I.field('البلدية *', communeNode),
          I.field('نوع المشروع *', type.node)
        ];
        if (isNew) { rows.push(I.field('المسار الأولي *', path.node)); if (eng) rows.push(I.field('المهندس المسؤول', eng.node)); }
        var content = h('div', { class: 'login-card', style: 'gap:12px;max-width:none' }, rows);
        I.modal({
          title: isNew ? 'مشروع جديد' : 'تعديل المشروع',
          content: content,
          onSubmit: function () {
            if (isNew) {
              return I.rpc('projects.create', {
                client_id: client.get(), site: site.value, commune: commune.value,
                type: type.get(), initial_path: path.get(), engineer_id: eng ? eng.get() : ''
              }).then(function (c) { replaceItem(c); I.toast('تم إنشاء ' + c.id); });
            }
            return I.rpc('projects.update', { id: p.id, site: site.value, commune: commune.value, type: type.get() })
              .then(function (u) { replaceItem(u); I.toast('تم الحفظ'); });
          }
        });
      }

      function openStage(p, done) {
        var st = select(state.opts.stages, p.stage);
        var note = h('input', { type: 'text', maxlength: '300', placeholder: 'اختياري' });
        I.modal({
          title: 'تغيير مرحلة المشروع',
          content: h('div', { class: 'login-card', style: 'gap:12px;max-width:none' }, [I.field('المرحلة', st), I.field('ملاحظة', note)]),
          onSubmit: function () {
            return I.rpc('projects.setStage', { id: p.id, stage: st.value, note: note.value })
              .then(function (u) { replaceItem(u); I.toast('تم تغيير المرحلة'); done(); });
          }
        });
      }

      function openTransfer(p, done) {
        I.rpc('projects.options').then(function (o) { state.opts = o; openTransferNow(p, done); }).catch(fail);
      }

      function openTransferNow(p, done) {
        var eng = select(state.opts.engineers, '', '— اختر المهندس —');
        var reason = h('input', { type: 'text', maxlength: '300', placeholder: 'سبب النقل (اختياري)' });
        I.modal({
          title: 'نقل المشروع إلى مهندس آخر',
          content: h('div', { class: 'login-card', style: 'gap:12px;max-width:none' }, [I.field('المهندس الجديد', eng), I.field('السبب', reason)]),
          onSubmit: function () {
            return I.rpc('projects.transfer', { id: p.id, engineer_id: eng.value, reason: reason.value })
              .then(function (u) { replaceItem(u); I.toast('تم نقل المشروع'); done(); });
          }
        });
      }

      /* ---------- التفاصيل ---------- */
      function openDetail(p0) {
        I.rpc('projects.get', { id: p0.id }).then(function (p) {
          var box = h('div', { class: 'pd', style: 'display:flex;flex-direction:column;gap:12px;max-width:none' });
          var modalRef = null;
          function reopen() { if (modalRef) modalRef.close(); openDetail(p0); }
          function kv(k, v) { return h('div', {}, [h('span', { class: 'muted', text: k + ': ' }), h('strong', { text: v || '—' })]); }
          box.appendChild(kv('الرقم', p.id));
          box.appendChild(kv('الزبون', p.client_name));
          box.appendChild(kv('الموقع', p.site + ' — ' + p.commune));
          box.appendChild(kv('النوع', p.type));
          box.appendChild(kv('المسار الأولي', p.initial_path));
          box.appendChild(kv('المرحلة', p.stage));
          box.appendChild(kv('المهندس', p.engineer_name));
          var M = I.ui.money;
          function mbox(label, v, neg) {
            return h('div', {}, [h('small', { text: label }), h('b', { class: neg ? 'neg' : '', 'data-count': String(v), 'data-fmt': 'money', text: M(v) })]);
          }
          var mrow = [];
          if (isAdmin) { mrow.push(mbox('المقبوضات', p.received || 0)); }
          mrow.push(mbox('المصاريف', p.spent || 0));
          if (isAdmin) { var left = Math.round(((p.received || 0) - (p.spent || 0)) * 100) / 100; mrow.push(mbox('الفرق', left, left < 0)); }
          box.appendChild(h('div', { class: 'pd-money', style: 'grid-template-columns:repeat(' + mrow.length + ',1fr)' }, mrow));
          box.appendChild(h('div', { class: 'pd-bar' }, [
            h('div', { class: 'prog' }, [
              h('span', { class: 'trk' }, [h('span', { class: 'fil', style: 'width:' + (p.pct || 0) + '%' })]),
              h('b', { text: (p.pct || 0) + '%' })
            ]),
            h('small', { class: 'muted', text: 'تقدم المشروع حسب المرحلة: ' + p.stage })
          ]));
          if (p.by_kind && p.by_kind.length) {
            var tot = p.by_kind.reduce(function (a, k) { return a + k.amount; }, 0) || 1;
            box.appendChild(h('h4', { text: 'توزيع المصاريف' }));
            box.appendChild(h('div', { class: 'pd-kind' }, p.by_kind.map(function (k) {
              return h('div', { style: 'display:flex;flex-direction:column;gap:4px' }, [
                h('div', { class: 'r' }, [h('span', { text: k.label }), h('b', { text: M(k.amount) })]),
                h('div', { class: 'trk' }, [h('span', { class: 'fil', style: 'width:' + Math.max(2, Math.round(k.amount * 100 / tot)) + '%' })])
              ]);
            })));
          }
          var acts = [h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'تغيير المرحلة', onclick: function () { openStage(p, reopen); } })];
          if (isAdmin) {
            acts.push(h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'نقل لمهندس', onclick: function () { openTransfer(p, reopen); } }));
            acts.push(h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'تعديل', onclick: function () { openForm(p); } }));
          }
          box.appendChild(h('div', { class: 'actions' }, acts));
          box.appendChild(h('h4', { text: 'سجل المراحل' }));
          box.appendChild(h('ul', {}, p.stages.map(function (s) {
            return h('li', { text: s.date + ' — ' + s.stage + (s.by ? ' (' + s.by + ')' : '') + (s.note ? ' — ' + s.note : '') });
          })));
          if (p.moves.length) {
            box.appendChild(h('h4', { text: 'سجل الإسناد' }));
            box.appendChild(h('ul', {}, p.moves.map(function (m) {
              return h('li', { text: m.date + ' — ' + (m.from || '—') + ' ← ' + m.to + (m.reason ? ' — ' + m.reason : '') });
            })));
          }
          modalRef = I.modal({ title: p.display_name, content: box, submitLabel: 'إغلاق', onSubmit: function () { return Promise.resolve(); } });
        }).catch(fail);
      }

      /* ---------- الجدول ---------- */
      function visible() {
        var q = (F.q || '').trim().toLowerCase();
        return state.items.filter(function (p) {
          if (!state.showOff && !p.active) return false;
          if (F.stage && p.stage !== F.stage) return false;
          if (F.eng && p.engineer_name !== F.eng) return false;
          if (F.type && p.type !== F.type) return false;
          if (F.path && p.initial_path !== F.path) return false;
          return !q || (p.display_name + ' ' + p.id + ' ' + p.commune).toLowerCase().indexOf(q) >= 0;
        });
      }
      function renderRows() {
        var rows = visible();
        count.textContent = rows.length + ' مشروعًا';
        tbody.textContent = '';
        if (!rows.length) {
          tbody.appendChild(h('tr', {}, [h('td', { colspan: '6', class: 'empty', text: 'لا توجد مشاريع' })]));
          return;
        }
        rows.forEach(function (p) {
          var actions = [h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'فتح', onclick: function () { openDetail(p); } })];
          if (isAdmin) {
            actions.push(h('button', {
              type: 'button', class: 'btn btn-ghost btn-sm', text: p.active ? 'أرشفة' : 'استرجاع',
              onclick: function () { replaceItem(Object.assign({}, p, { active: !p.active })); I.rpc('projects.setActive', { id: p.id, active: !p.active }, { mode: 'quiet' }).then(replaceItem).catch(function (e) { replaceItem(p); fail(e); }); }
            }));
          }
          tbody.appendChild(h('tr', { class: p.active ? '' : 'off' }, [

        U.printList({ title: 'قائمة المشاريع', filters: fb ? fb.describe() : '', cols: isAdmin ? ['المشروع', 'النوع', 'المرحلة', 'المهندس', 'المسار'] : ['المشروع', 'النوع', 'المرحلة', 'المسار'],
          rows: rows.map(function (p) { var r = [p.display_name + ' (' + p.id + ')', p.type, p.stage]; if (isAdmin) r.push(p.engineer_name || '—'); r.push(p.initial_path); return r; }),
          signs: ['أُعدّ بواسطة', 'المدير العام'] });
      } }));
      if (isAdmin) toolbar.push(h('button', { class: 'btn btn-primary', type: 'button', text: '+ مشروع جديد', onclick: function () { openForm(null); } }));
      body.appendChild(barBox);
      body.appendChild(h('div', { class: 'toolbar' }, toolbar));
      body.appendChild(h('div', { class: 'table-wrap' }, [
        h('table', {}, [
          h('thead', {}, [h('tr', {}, ['المشروع', 'النوع', 'المرحلة', 'المهندس', 'المسار', 'إجراءات'].map(function (t) { return h('th', { text: t }); }))]),
          tbody
        ])
      ]));

      function load() {
        Promise.all([I.rpc('projects.options'), I.rpc('projects.list')]).then(function (r) {
          state.opts = r[0]; state.items = r[1];
          if (!fb) {
            var defs = [
              { key: 'q', type: 'search', label: 'بحث', placeholder: 'الاسم أو الرقم...' },
              { key: 'stage', type: 'select', label: 'المرحلة', all: 'كل المراحل', options: r[0].stages.map(function (s) { return { id: s, label: s }; }) },
              { key: 'type', type: 'select', label: 'النوع', all: 'كل الأنواع', options: U.uniq(state.items, function (p) { return p.type; }) },
              { key: 'path', type: 'select', label: 'المسار', all: 'كل المسارات', options: U.uniq(state.items, function (p) { return p.initial_path; }) }
            ];
            if (isAdmin) defs.splice(2, 0, { key: 'eng', type: 'select', label: 'المهندس', all: 'كل المهندسين', options: U.uniq(state.items, function (p) { return p.engineer_name; }) });
            fb = U.filterBar(defs, F, renderRows);
            barBox.appendChild(fb.node);

          renderRows();
          if (I.pending && I.pending.project) {
            var want = state.items.filter(function (x) { return x.id === I.pending.project; })[0];
            I.pending.project = null;
            if (want) openDetail(want);
          }

      I.refresher(function () { load(); });

    }
  });
})();
