<script>
(function () {
  'use strict';
  var I = window.INOURAR, h = I.h;
  var CHARS = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';

  function genPassword() {
    var a = new Uint32Array(12), out = '';
    window.crypto.getRandomValues(a);
    for (var i = 0; i < a.length; i++) out += CHARS.charAt(a[i] % CHARS.length);
    return out;
  }

  // حقل كلمة سر + زر توليد + إظهار
  function passwordField(label, withGen) {
    var input = h('input', { type: 'password', autocomplete: 'new-password', maxlength: '72', required: true });
    var row = [input];
    var show = h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'إظهار', onclick: function () {
      var on = input.type === 'password'; input.type = on ? 'text' : 'password'; show.textContent = on ? 'إخفاء' : 'إظهار';
    } });
    row.push(show);
    if (withGen) row.push(h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'توليد', onclick: function () {
      input.value = genPassword(); input.type = 'text'; show.textContent = 'إخفاء';
    } }));
    return { input: input, node: I.field(label, h('div', { style: 'display:flex;gap:6px' }, row)) };
  }

  /* ---------- كلمة السر الشخصية (زر في الشريط العلوي) ---------- */
  var pwBtn = document.getElementById('pwBtn');
  if (pwBtn) pwBtn.addEventListener('click', function () {
    var cur = h('input', { type: 'password', autocomplete: 'current-password', required: true });
    var n1 = passwordField('كلمة السر الجديدة (8 أحرف على الأقل)', false);
    var n2 = h('input', { type: 'password', autocomplete: 'new-password', required: true });
    I.modal({
      title: 'تغيير كلمة سري',
      content: h('div', { class: 'login-card', style: 'gap:12px;max-width:none' }, [
        I.field('كلمة السر الحالية', cur), n1.node, I.field('أعد كتابة الجديدة', n2)
      ]),
      onSubmit: function () {
        if (n1.input.value !== n2.value) return Promise.reject(new Error('كلمتا السر غير متطابقتين'));
        return I.rpc('account.changePassword', { current: cur.value, password: n1.input.value })
          .then(function () { I.toast('تم تغيير كلمة السر. الأجهزة الأخرى سجّلت الخروج'); });
      }
    });
  });

  /* ---------- وحدة الموظفين ---------- */
  I.register('personnel', {
    title: 'الموظفون والصلاحيات',
    render: function (body) {
      var me = I.user();
      var state = { items: [], clients: [], q: '', role: '', st: '' };
      var tbody = h('tbody', {});
      var count = h('span', { class: 'muted' });

      function fail(err) { I.toast(err.message || 'حدث خطأ', 'error'); }
      function canManage(role) { return me.role === 'DG' || (me.role === 'RESP' && (role === 'ING' || role === 'CLIENT')); }
      function replaceItem(u) {
        var f = false;
        state.items = state.items.map(function (x) { if (x.id === u.id) { f = true; return u; } return x; });
        if (!f) state.items.push(u);
        renderRows();
      }

      function openCreate() {
        var roles = me.role === 'DG'
          ? [['ING', 'ingénieur — مهندس'], ['RESP', 'مسؤول الإنجاز'], ['DG', 'مدير عام'], ['CLIENT', 'زبون']]
          : [['ING', 'ingénieur — مهندس'], ['CLIENT', 'زبون']];
        var role = h('select', {}, roles.map(function (r) { return h('option', { value: r[0], text: r[1] }); }));
        var full = h('input', { type: 'text', maxlength: '80', required: true });
        var user = h('input', { type: 'text', maxlength: '30', required: true, autocapitalize: 'none', autocomplete: 'off', placeholder: 'مثال: ali.m' });
        var phone = h('input', { type: 'tel', placeholder: 'اختياري' });
        var cl = h('select', {}, [h('option', { value: '', text: '— اختر الزبون —' })].concat(
          state.clients.filter(function (c) { return c.active; }).map(function (c) { return h('option', { value: c.id, text: c.name }); })));
        var clWrap = I.field('الزبون المرتبط *', cl);
        clWrap.hidden = true;
        role.addEventListener('change', function () { clWrap.hidden = role.value !== 'CLIENT'; });
        var pw = passwordField('كلمة السر المؤقتة *', true);
        I.modal({
          title: 'حساب جديد',
          content: h('div', { class: 'login-card', style: 'gap:12px;max-width:none' }, [
            I.field('الدور *', role), I.field('الاسم الكامل *', full), I.field('اسم المستخدم *', user),
            clWrap, I.field('الهاتف', phone), pw.node,
            h('p', { class: 'muted', text: 'سلّم كلمة السر للمعني مباشرة؛ لن تظهر مرة أخرى، ويمكنه تغييرها من «كلمة سري».' })
          ]),
          onSubmit: function () {
            return I.rpc('users.create', {
              role: role.value, full_name: full.value, username: user.value, phone: phone.value,
              client_id: cl.value, password: pw.input.value
            }).then(function (u) { replaceItem(u); I.toast('تم إنشاء الحساب'); });
          }
        });
      }

      function openEdit(u) {
        var full = h('input', { type: 'text', value: u.full_name, maxlength: '80', required: true });
        var phone = h('input', { type: 'tel', value: u.phone });
        I.modal({
          title: 'تعديل ' + u.username,
          content: h('div', { class: 'login-card', style: 'gap:12px;max-width:none' }, [I.field('الاسم الكامل', full), I.field('الهاتف', phone)]),
          onSubmit: function () {
            return I.rpc('users.update', { id: u.id, full_name: full.value, phone: phone.value })
              .then(function (r) { replaceItem(r); I.toast('تم الحفظ'); });
          }
        });
      }

      function openReset(u) {
        var pw = passwordField('كلمة السر الجديدة *', true);
        I.modal({
          title: 'إعادة تعيين كلمة سر ' + u.username,
          content: h('div', { class: 'login-card', style: 'gap:12px;max-width:none' }, [
            pw.node, h('p', { class: 'muted', text: 'ستُنهى جلساته الحالية فورًا.' })
          ]),
          onSubmit: function () {
            return I.rpc('users.resetPassword', { id: u.id, password: pw.input.value }).then(function () { I.toast('تم تغيير كلمة السر'); });
          }
        });
      }

      function toggle(u) {
        replaceItem(Object.assign({}, u, { active: !u.active }));
        I.rpc('users.setActive', { id: u.id, active: !u.active }, { mode: 'quiet' }).then(replaceItem).catch(function (e) { replaceItem(u); fail(e); });
      }

      function visible() {
        var q = state.q.trim().toLowerCase();
        return state.items.filter(function (u) {
          if (state.role && u.role !== state.role) return false;
          if (state.st === 'on' && !u.active) return false;
          if (state.st === 'off' && u.active) return false;
          return !q || (u.full_name + ' ' + u.username).toLowerCase().indexOf(q) >= 0;
        });
      }
      function renderRows() {
        var rows = visible();
        count.textContent = rows.length + ' حسابًا';
        tbody.textContent = '';
        if (!rows.length) { tbody.appendChild(h('tr', {}, [h('td', { colspan: '6', class: 'empty', text: 'لا توجد حسابات' })])); return; }
        rows.forEach(function (u) {
          var acts = [];
          if (canManage(u.role)) {
            acts.push(h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'تعديل', onclick: function () { openEdit(u); } }));
            if (u.id !== me.id) {
              acts.push(h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'كلمة السر', onclick: function () { openReset(u); } }));
              acts.push(h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: u.active ? 'تعطيل' : 'تفعيل', onclick: function () { toggle(u); } }));
            }
          }
          tbody.appendChild(h('tr', { class: u.active ? '' : 'off' }, [
            h('td', {}, [h('div', { text: u.full_name }), h('small', { class: 'muted', text: u.username })]),
            h('td', { text: u.role_label + (u.client_name ? ' — ' + u.client_name : '') }),
            h('td', { text: u.phone }),
            h('td', { text: u.last_login || '—' }),
            h('td', {}, [h('span', { class: 'badge ' + (u.active ? 'ok' : ''), text: u.active ? 'مفعّل' : 'معطَّل' })]),
            h('td', { class: 'actions' }, acts)
          ]));
        });
      }

      body.appendChild(h('div', { class: 'toolbar' }, [
        h('input', { type: 'search', placeholder: 'بحث بالاسم...', oninput: function (e) { state.q = e.target.value; renderRows(); } }),
        h('select', { onchange: function (e) { state.role = e.target.value; renderRows(); } }, [h('option', { value: '', text: 'كل الأدوار' }), h('option', { value: 'DG', text: 'مدير عام' }), h('option', { value: 'RESP', text: 'مسؤول الإنجاز' }), h('option', { value: 'ING', text: 'مهندس' }), h('option', { value: 'CLIENT', text: 'زبون' })]),
        h('select', { onchange: function (e) { state.st = e.target.value; renderRows(); } }, [h('option', { value: '', text: 'كل الحالات' }), h('option', { value: 'on', text: 'مفعّل' }), h('option', { value: 'off', text: 'معطَّل' })]),
        h('span', { class: 'spacer' }), count,
        h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'طباعة / PDF', onclick: function () {
          var rows = visible();
          I.ui.printList({ title: 'قائمة الحسابات', filters: [state.q ? 'بحث: ' + state.q : '', state.role ? 'الدور: ' + state.role : '', state.st === 'on' ? 'المفعّلون' : state.st === 'off' ? 'المعطَّلون' : ''].filter(Boolean).join(' — ') || 'بلا فلاتر',
            cols: ['الاسم', 'اسم المستخدم', 'الدور', 'الهاتف', 'الحالة'], rows: rows.map(function (u) { return [u.full_name, u.username, u.role_label, u.phone || '', u.active ? 'مفعّل' : 'معطَّل']; }), signs: ['أُعدّ بواسطة', 'المدير العام'] });
        } }),
        h('button', { class: 'btn btn-primary', type: 'button', text: '+ حساب جديد', onclick: openCreate })
      ]));
      body.appendChild(h('div', { class: 'table-wrap' }, [
        h('table', {}, [
          h('thead', {}, [h('tr', {}, ['الاسم', 'الدور', 'الهاتف', 'آخر دخول', 'الحالة', 'إجراءات'].map(function (t) { return h('th', { text: t }); }))]),
          tbody
        ])
      ]));

      function load() {
        Promise.all([I.rpc('users.list'), I.rpc('clients.list')]).then(function (r) {
          state.items = r[0]; state.clients = r[1]; renderRows();
        }).catch(fail);
      }
      I.refresher(function () { load(); });
      load();
    }
  });
})();
</script>

<script>
(function () {
  'use strict';
  var I = window.INOURAR, h = I.h, U = I.ui;

  var METHODS = [{ id: 'CASH', label: 'نقدًا' }, { id: 'CHEQUE', label: 'شيك' }, { id: 'TRANSFER', label: 'تحويل' }];
  var STATUS_CLASS = { PENDING: 'warn', APPROVED: 'ok', REJECTED: '', CANCELLED: '', VOID: '' };

  var money = U.money;
  function thead(cols) { return h('thead', {}, [h('tr', {}, cols.map(function (t) { return h('th', { text: t }); }))]); }
  function wrapTable(cols, tbody) { return h('div', { class: 'table-wrap' }, [h('table', {}, [thead(cols), tbody])]); }
  function box(label, value, neg) {
    return h('div', { class: 'box' }, [h('div', { class: 'muted', text: label }), h('div', { class: 'v' + (neg ? ' neg' : ''), text: money(value) + ' DA', 'data-count': String(value), 'data-fmt': 'money', 'data-suffix': ' DA' })]);
  }
  function formCard(children) { return h('div', { class: 'login-card', style: 'gap:12px;max-width:none' }, children); }


  /* ---------- طابور الحفظ في الخلفية: كل سطر يظهر فورًا ويُرسل بلا انتظار، ويبقى محفوظًا في الهاتف حتى يتأكد حفظه ---------- */
  var QV = { uid: null, items: null, busy: false, draw: null, saved: null, timer: null };
  function qKey() { return 'inourar_q_' + (I.user() ? I.user().id : ''); }
  function newRef() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  function qItems() {
    var uid = I.user() ? I.user().id : '';
    if (QV.items && QV.uid === uid) return QV.items;
    QV.uid = uid; QV.items = []; QV.busy = false;
    try {
      var a = JSON.parse(localStorage.getItem(qKey()) || '[]');
      if (Array.isArray(a)) a.forEach(function (q) { if (q && q.line && q.ref) { q.status = (q.status === 'err' && q.fatal) ? 'err' : 'pending'; QV.items.push(q); } });
    } catch (e) {}
    return QV.items;
  }
  function qPersist() {
    try { localStorage.setItem(qKey(), JSON.stringify(qItems().filter(function (q) { return q.status !== 'ok'; }))); } catch (e) {}
  }
  function qDraw() { if (QV.draw) QV.draw(); }
  function qPump() {
    if (QV.busy) return;
    var items = qItems();
    var first = items.filter(function (q) { return q.status === 'pending'; })[0];
    if (!first) return;
    var bref = first.bref || (first.bref = newRef());
    var grp = items.filter(function (q) { return q.status === 'pending' && (q.bref === bref || !q.bref); }).slice(0, 50);
    grp.forEach(function (q) { q.bref = bref; q.status = 'sending'; });
    QV.busy = true; qPersist(); qDraw();
    var again = true;
    I.rpc('charges.createBatch', { lines: grp.map(function (q) { return q.line; }), ref: bref }, { mode: 'silent' }).then(function (r) {
      grp.forEach(function (q, i) { q.status = 'ok'; q.id = r.items[i] ? r.items[i].id : ''; q.err = ''; });
      if (QV.saved) QV.saved(r);
      if (I.user() && (I.user().role === 'DG' || I.user().role === 'RESP') && r.balances.some(function (x) { return x.balance < 0; })) I.toast('تنبيه: رصيد الصندوق سالب', 'error', 5000);
    }).catch(function (e) {
      var net = !e.code;                    // لا رمز = انقطاع اتصال: نعيد المحاولة تلقائيًا
      if (!net && e.code !== 'AUTH_REQUIRED' && grp.length > 1) {
        // الخادم يرفض الدفعة كلها (لم يُحفظ شيء). نعزل السطر المعيب برقمه، ونُعيد البقية بدفعة جديدة فلا يتعطل غيره
        var m = /^السطر (\d+): ?([\s\S]*)$/.exec(e.message || ''), bad = m ? grp[Number(m[1]) - 1] : null, nb = newRef();
        grp.forEach(function (q) {
          if (q === bad) { q.status = 'err'; q.fatal = true; q.err = m[2]; q.bref = null; }
          else { q.status = 'pending'; q.bref = bad ? nb : newRef(); }       // رقم السطر غير معروف: كل سطر يُرسل وحده ليتبيّن المعيب
        });
        if (bad) I.toast('تعذّر حفظ سطر: ' + m[2], 'error', 6000);
        return;
      }
      grp.forEach(function (q) {
        q.tries = (q.tries || 0) + 1; q.err = e.message || 'تعذّر الحفظ';
        if (e.code === 'AUTH_REQUIRED') { q.status = 'pending'; again = false; }
        else if (net) { q.status = 'pending'; again = false; clearTimeout(QV.timer); QV.timer = setTimeout(qPump, Math.min(30000, 3000 * q.tries)); }   // انقطاع الاتصال: لا نستسلم أبدًا، تبقى محفوظة وتُعاد كل 30ث كحدٍّ أقصى
        else { q.status = 'err'; q.fatal = !net; }
      });
      if (!net && e.code !== 'AUTH_REQUIRED') I.toast(e.message || 'تعذّر حفظ السطر', 'error', 5000);
    }).then(function () { QV.busy = false; qPersist(); qDraw(); if (again) qPump(); });
  }
  // يُعيد المحاولة تلقائيًا: عند عودة الاتصال، وعند فتح التطبيق من جديد، وكل 30ث (في أي شاشة)
  function qKick() { if (I.user() && navigator.onLine !== false) { clearTimeout(QV.timer); qPump(); } }
  window.addEventListener('online', qKick);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') qKick(); });
  setInterval(function () { if (I.user() && document.visibilityState !== 'hidden') qKick(); }, 30000);
  function qRetry(q) { q.status = 'pending'; q.fatal = false; q.tries = 0; qPersist(); qDraw(); qPump(); }
  function qRemove(q) { var a = qItems(); a.splice(a.indexOf(q), 1); qPersist(); qDraw(); }

  I.register('caisses', {
    title: 'الصناديق والخزينة',
    render: function (body) {
      var me = I.user();
      var isAdmin = me.role === 'DG' || me.role === 'RESP';
      var tabsBox = h('div', { class: 'pills' });
      var area = h('div', {});
      var tabs = isAdmin
        ? [['caisses', 'الصناديق'], ['charges', 'المصاريف'], ['versements', 'الدفعات'], ['transfers', 'التحويلات']]
        : [['mine', 'صندوقي'], ['charges', 'المصاريف'], ['transfers', 'طلبات المبالغ']];
      var current = tabs[0][0];
      var intent = I.pending.caisses || null; I.pending.caisses = null;
      if (intent && intent.tab && tabs.some(function (t) { return t[0] === intent.tab; })) current = intent.tab;
      // حالة تبقى حيّة عند إعادة رسم الشاشة (تحديث/تبديل تبويب): الفلاتر ونموذج المصاريف والأسطر غير المحفوظة
      var FST = { charges: {}, versements: {}, transfers: {}, caisses: {}, movements: {} };
      var CH = { V: { kind: 'MAT', work: 'STD', project: '', date: '', tiers: '', article: '', detail: '', etape: '', qty: '', unit: '', price: '', amount: '', note: '', sbon: '', locked: false, more: false } };
      var leaveHook = null;
      body.appendChild(tabsBox);
      body.appendChild(area);

      function fail(err) { I.toast(err.message || 'حدث خطأ', 'error'); }
      function drawTabs() {
        tabsBox.textContent = '';
        tabs.forEach(function (t) {
          tabsBox.appendChild(h('button', {
            type: 'button', class: 'pill' + (t[0] === current ? ' on' : ''), text: t[1],
            onclick: function () { if (leaveHook) { leaveHook(); leaveHook = null; } current = t[0]; drawTabs(); load(); }
          }));
        });
      }
      function load() {
        area.textContent = '';
        I.refresher(function () { load(); });
        ({ caisses: tabCaisses, charges: tabCharges, versements: tabVersements, transfers: tabTransfers, mine: tabMine })[current]();
        if (!area.querySelector('.skel')) I.skel(area);
      }

      /* ---------- حركات صندوق ---------- */
      function movementsTable(rows) {
        var tb = h('tbody', {});
        if (!rows.length) tb.appendChild(h('tr', {}, [h('td', { colspan: '4', class: 'empty', text: 'لا حركات بعد' })]));
        rows.forEach(function (r) {
          tb.appendChild(h('tr', {}, [
            h('td', { text: r.date }), h('td', { text: r.label }),
            h('td', { class: r.amount < 0 ? 'neg' : '', text: money(r.amount, true) }),
            h('td', { class: r.balance < 0 ? 'neg' : '', text: money(r.balance) })
          ]));
        });
        return wrapTable(['التاريخ', 'البيان', 'المبلغ', 'الرصيد'], tb);
      }
      function printStatement(rows, title, signs, period) {
        var chrono = rows.slice().reverse();
        U.print({
          title: 'كشف حساب', ref: '', date: '',
          rows: [['الصندوق', title], ['الفترة', period || 'كل الحركات'], ['عدد الحركات', String(rows.length)], ['الرصيد بعد آخر حركة', rows.length ? money(rows[0].balance) + ' دج' : money(0) + ' دج']],
          table: {
            cols: ['التاريخ', 'البيان', 'المبلغ', 'الرصيد'],
            rows: chrono.map(function (r) { return [r.date, r.label, { t: money(r.amount, true), num: true, neg: r.amount < 0 }, { t: money(r.balance), num: true, neg: r.balance < 0 }]; })
          },
          signs: signs
        });
      }
      function withPrint(rows, title, signs) {
        var F = FST.movements[title] = FST.movements[title] || {};
        var holder = h('div', {}), fb;
        function vis() {
          return rows.filter(function (r) {
            if (F.dir === 'in' && !(r.amount > 0)) return false;
            if (F.dir === 'out' && !(r.amount < 0)) return false;
            return U.inRange(r.date, F.from, F.to);
          });
        }
        function draw() {
          holder.textContent = ''; var v = vis();
          holder.appendChild(movementsTable(v));
          var tin = 0, tout = 0; v.forEach(function (r) { if (r.amount > 0) tin += r.amount; else tout += -r.amount; });
          if (v.length) holder.appendChild(h('p', { class: 'muted', text: v.length + ' حركة' + (F.dir !== 'out' ? ' — المداخيل: ' + money(tin) : '') + (F.dir !== 'in' ? ' — المخاريج: ' + money(tout) : '') }));
        }
        fb = U.filterBar([
          { key: 'dir', type: 'select', label: 'نوع الحركة', all: 'الكل (مداخيل ومخاريج)', options: [{ id: 'in', label: 'المداخيل فقط' }, { id: 'out', label: 'المخاريج فقط' }] },
          { key: 'from', type: 'date', label: 'من تاريخ' }, { key: 'to', type: 'date', label: 'إلى تاريخ' }
        ], F, draw);
        var box = h('div', {}, [
          fb.node,
          h('div', { class: 'toolbar' }, [h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'طباعة / PDF', onclick: function () { printStatement(vis(), title, signs, F.from || F.to || F.dir ? fb.describe() : ''); } })]),
          holder
        ]);
        draw();
        return box;
      }
      function showMovements(caisse, title) {
        I.rpc('caisses.movements', { caisse: caisse }).then(function (rows) {
          I.modal({ title: title, content: withPrint(rows, title, ['أُعدّ بواسطة', 'المدير العام']), submitLabel: 'إغلاق', onSubmit: function () { return Promise.resolve(); } });
        }).catch(fail);
      }
      // تحويل سريع من بطاقة المهندس (مدير/مسؤول) أو طلب مبلغ (مهندس)
      function quickTransfer(engineer, after) {
        var asAdmin = isAdmin;
        var date = U.dateField(), amount = U.moneyField();
        var note = h('input', { type: 'text', maxlength: '300', placeholder: asAdmin ? 'اختياري' : 'سبب الطلب (اختياري)' });
        var fields = [];
        if (asAdmin) fields.push(h('p', { class: 'muted', text: 'التحويل إلى: ' + engineer.name }));
        fields.push(I.field('التاريخ', date.node), I.field('المبلغ (DA) *', amount.node), I.field('ملاحظة', note));
        I.modal({
          title: asAdmin ? 'تحويل إلى صندوق ' + engineer.name : 'طلب مبلغ من الخزينة',
          content: formCard(fields),
          onSubmit: function () {
            var a = amount.get(); if (!(a > 0)) throw new Error('أدخل المبلغ');
            return I.rpc('transfers.create', { engineer_id: asAdmin ? engineer.id : '', op_date: date.get(), amount: a, note: note.value })
              .then(function (t) {
                I.toast(asAdmin ? 'تم التحويل' : 'أُرسل الطلب إلى المسؤول');
                if (t.central_balance !== undefined && t.central_balance < 0) I.toast('تنبيه: رصيد الخزينة المركزية أصبح سالبًا', 'error', 6000);
                if (after) after();
              });
          }
        });
      }

      /* ---------- تبويب الصناديق (إدارة) ---------- */
      function tabCaisses() {
        I.rpc('caisses.summary').then(function (s) {
          area.appendChild(h('div', { class: 'stat' }, [
            box('الخزينة المركزية', s.central.balance, s.central.balance < 0),
            box('إجمالي الدفعات المستلمة', s.central.in), box('إجمالي التحويلات للمهندسين', s.central.out)
          ]));
          if (s.central.balance < 0) area.appendChild(h('p', { class: 'neg', text: 'تنبيه: رصيد الخزينة المركزية سالب.' }));
          area.appendChild(h('div', { class: 'toolbar' }, [
            h('button', { type: 'button', class: 'btn btn-ghost', text: 'حركات الخزينة المركزية', onclick: function () { showMovements('CENTRAL', 'الخزينة المركزية'); } })
          ]));
          var tb = h('tbody', {});
          var F = FST.caisses, fb;
          function vis() {
            var q = U.norm((F.q || '').trim());
            return s.engineers.filter(function (e) {
              if (F.neg === 'neg' && !(e.balance < 0)) return false;
              if (F.neg === 'pend' && !e.pending) return false;
              return !q || U.norm(e.name).indexOf(q) >= 0;
            });
          }
          function drawEng() {
            tb.textContent = '';
            var rows = vis();
            if (!rows.length) tb.appendChild(h('tr', {}, [h('td', { colspan: '6', class: 'empty', text: s.engineers.length ? 'لا نتائج' : 'لا يوجد مهندسون بعد' })]));
            rows.forEach(function (e) {
              tb.appendChild(h('tr', {}, [
                h('td', { text: e.name }), h('td', { text: money(e.received) }), h('td', { text: money(e.spent) }),
                h('td', { class: e.balance < 0 ? 'neg' : '', text: money(e.balance) }),
                h('td', {}, e.pending ? [h('span', { class: 'badge warn', text: 'طلب ' + money(e.pending) })] : []),
                h('td', { class: 'actions' }, [
                  h('button', { type: 'button', class: 'btn btn-primary btn-sm', text: 'تحويل', onclick: function () { quickTransfer(e, load); } }),
                  h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'الحركات', onclick: function () { showMovements(e.id, 'صندوق ' + e.name); } })
                ])
              ]));
            });
          }
          fb = U.filterBar([
            { key: 'q', type: 'search', label: 'بحث بالمهندس' },
            { key: 'neg', type: 'select', label: 'الحالة', all: 'كل الصناديق', options: [{ id: 'neg', label: 'رصيد سالب' }, { id: 'pend', label: 'لديه طلب معلّق' }] }
          ], F, drawEng);
          area.appendChild(fb.node);
          area.appendChild(h('div', { class: 'toolbar' }, [h('span', { class: 'spacer' }), h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'طباعة / PDF', onclick: function () {
            var rows = vis();
            U.printList({ title: 'أرصدة صناديق المهندسين', filters: fb.describe(), cols: ['المهندس', 'المستلم', 'المصروف', 'الرصيد'],
              rows: rows.map(function (e) { return [e.name, { t: money(e.received), num: true }, { t: money(e.spent), num: true }, { t: money(e.balance), num: true, neg: e.balance < 0 }]; }),
              total: rows.reduce(function (a, e) { return a + e.balance; }, 0), totalLabel: 'مجموع الأرصدة', signs: ['أُعدّ بواسطة', 'المدير العام'] });
          } })]));
          area.appendChild(wrapTable(['المهندس', 'المستلم', 'المصروف', 'الرصيد', 'طلبات معلّقة', ''], tb));
          drawEng();
        }).catch(fail);
      }

      // قرارات المكتب على طلبات المهندس: قبول ← «تأكيد الاستلام»
      var mineListener = null;
      function mineNotices() {
        var box = h('div', { class: 'notices' });
        function paint() {
          box.textContent = '';
          I.notif.get().decided.forEach(function (x) {
            var ok = x.status === 'APPROVED';
            box.appendChild(h('div', { class: 'notice ' + (ok ? 'ok' : 'bad') }, [
              h('span', { class: 'grow' }, [h('b', { text: ok ? '✓ قُبل طلبك — ' + money(x.amount) + ' دج أُضيفت إلى صندوقك' : 'رُفض طلبك — ' + money(x.amount) + ' دج' }), x.reason ? h('small', { text: ' ' + x.reason }) : null]),
              h('button', { type: 'button', class: 'btn btn-primary btn-sm', text: ok ? 'تأكيد الاستلام' : 'حسنًا', onclick: function (e) {
                var b = e.currentTarget; b.disabled = true;
                I.rpc('transfers.ack', { ids: [x.id] }, { mode: 'silent' }).then(function () { I.toast(ok ? '✓ تم تأكيد الاستلام' : 'تم', 'ok', 2500); I.notif.refresh(); }).catch(function (err) { b.disabled = false; fail(err); });
              } })
            ]));
          });
        }
        if (mineListener) I.notif.off(mineListener);
        mineListener = paint; I.notif.on(paint); paint();
        return box;
      }

      /* ---------- صندوقي (مهندس) ---------- */
      function tabMine() {
        Promise.all([I.rpc('caisses.summary'), I.rpc('caisses.movements', { caisse: me.id })]).then(function (r) {
          var m = r[0].mine;
          area.appendChild(h('div', { class: 'stat' }, [box('رصيدي', m.balance, m.balance < 0), box('المستلم', m.received), box('المصروف', m.spent)]));
          if (m.balance < 0) area.appendChild(h('p', { class: 'neg', text: 'تنبيه: رصيد صندوقك سالب.' }));
          area.appendChild(mineNotices());
          area.appendChild(h('div', { class: 'toolbar' }, [
            h('button', { type: 'button', class: 'btn btn-primary', text: '+ طلب مبلغ', onclick: function () { quickTransfer(null, load); } })
          ]));
          area.appendChild(withPrint(r[1], 'صندوق ' + me.full_name, ['المهندس', 'المدير العام']));
          if (intent && intent.action === 'request') { intent = null; quickTransfer(null, load); }
        }).catch(fail);
      }


      /* ---------- المصاريف: إدخال دفعة أسطر ---------- */
      function tabCharges() {
        var S = { opts: null, items: [], balance: null };
        // آخر قيم أُدخلت: تبقى بعد كل إضافة، ونغيّر منها ما يتجدد فقط
        var V = CH.V;
        var panel = h('div', { class: 'panel' });
        var queueBox = h('div', { class: 'qbox' });
        var statusNode = h('div', { class: 'savestate', role: 'status', 'aria-live': 'polite', hidden: true });
        var histBox = h('div', {});
        var W = {};          // الأدوات الحالية
        var tb = h('tbody', {});
        var count = h('span', { class: 'muted' });
        // التحديث لا يمسّ الأسطر غير المحفوظة: التلقائي يتجاهلها بصمت، واليدوي ينبّه
        // التحديث (تلقائيًا أو يدويًا) لا يعيد بناء النموذج أبدًا: يجلب السجل فقط، فلا يضيع اختيار ولا نص مكتوب
        I.refresher(function () {
          I.rpc('charges.list', {}, { mode: 'silent', fresh: true }).then(function (items) { S.items = items; drawHist(); }).catch(function () {});
        });
        leaveHook = function () { try { sync(); } catch (e) {} };

        function strItems(arr) { return arr.map(function (s) { return { id: s, label: s }; }); }
        function sync() {   // يقرأ الأدوات إلى V قبل إعادة بناء الجزء المتغير
          if (W.project) V.project = W.project.get();
          if (W.date) V.date = W.date.get();
          if (W.tiers) V.tiers = W.tiers.get();
          if (W.article) V.article = W.article.get();
          if (W.detail) V.detail = W.detail.get();
          if (W.etape) V.etape = W.etape.get();
          if (W.qty) V.qty = W.qty.value;
          if (W.unit) V.unit = W.unit.get();
          if (W.price) V.price = W.price.get();
          if (W.amount) V.amount = W.amount.get();
          V.note = W.note ? W.note.value : V.note;
          V.sbon = W.sbon ? W.sbon.value : V.sbon;
        }
        function num(x) { return (typeof x === 'number' && isFinite(x)) ? x : ''; }

        function autoAmount() {
          if (!W.qty || !W.price) return;
          var q = Number(W.qty.value), p = W.price.get();
          if (q > 0 && p > 0) { W.amount.set(Math.round(q * p * 100) / 100); W.amount.input.readOnly = true; }
          else { W.amount.input.readOnly = false; }
        }

        var KIND_ICON = { MAT: '🧱', LOC: '🚜', OUV: '👷', MAC: '🔨', SST: '🏗️' };
        function kindName(id) { return (S.opts.kinds.filter(function (k) { return k.id === id; })[0] || { label: '' }).label; }
        function plainField(text, node) { return h('div', { class: 'fld' }, [h('span', { class: 'lbl', text: text }), node]); }

        function buildPanel() {
          var o = S.opts, rule = o.rules[V.kind];
          panel.textContent = '';
          W = {};
          var kname = h('b', { class: 'kname', text: kindName(V.kind).split(' (')[0] });
          W.kind = U.chips(o.kinds.map(function (k) { return { id: k.id, label: KIND_ICON[k.id] || k.label, title: k.label.split(' (')[0] }; }), V.kind, function (k) {
            sync();
            if (o.rules[k].tiersList !== o.rules[V.kind].tiersList) { V.tiers = ''; V.locked = false; }   // قائمة الأطراف تتغير (مورد ↔ معلّم)
            V.kind = k; buildPanel();
          });
          W.work = U.chips(o.work_types, V.work, function (w) { V.work = w; });
          W.project = U.combo(o.projects.map(function (p) { return { id: p.id, label: p.name, sub: p.id }; }), { value: V.project, placeholder: 'اكتب اسم الزبون أو الموقع...' });
          W.date = U.dateField(V.date || undefined);
          W.etape = U.combo(strItems(o.lists.etape), { value: V.etape, placeholder: 'اكتب أول حرف...', allowNew: true });
          var grid = [];
          var hdrFilled = V.project && (!rule.tiersList || V.tiers);
          var hdr = null;
          if (V.locked && hdrFilled) {
            // الرأس (المشروع/المورد/التاريخ) ثابت لهذه الجلسة: يُطوى في شريط صغير، ويفتحه «تغيير»
            var pn = (o.projects.filter(function (p) { return p.id === V.project; })[0] || {}).name || '';
            var dtxt = (!V.date || V.date === U.today()) ? 'اليوم' : V.date;
            hdr = h('div', { class: 'hdrbar' }, [
              h('span', { class: 'ht', text: [pn, V.tiers, dtxt].filter(Boolean).join(' · ') }),
              h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'تغيير', onclick: function () { sync(); V.locked = false; buildPanel(); } })
            ]);
          } else {
            grid.push(I.field('التاريخ', W.date.node));
            if (o.projects.length > 1 || !V.project) grid.push(I.field('المشروع *', W.project.node));
            grid.push(I.field('المرحلة *', W.etape.node));
            if (rule.tiersList) {
              W.tiers = U.combo(strItems(o.lists[rule.tiersList]), { value: V.tiers, placeholder: 'اكتب أول حرف...', allowNew: true });
              grid.push(I.field(rule.tiersList === 'macon' ? 'المعلّم *' : 'المورد *', W.tiers.node));
            }
          }
          if (hdr) grid.push(I.field('المرحلة *', W.etape.node));
          // التفاصيل الاختيارية (المادة/الكمية/السعر/الوحدة أو التفصيل): مخفية حتى يطلبها المهندس
          var moreItems = [];
          if (rule.article) {
            W.article = U.combo(strItems(o.lists.article), { value: V.article, placeholder: 'اكتب أول حرف...', onChange: prefill, allowNew: true });
            moreItems.push(I.field('المادة', W.article.node));
          }
          if (rule.detail) {
            W.detail = U.combo(strItems(o.lists.detail), { value: V.detail, placeholder: 'اختياري', allowNew: true });
            moreItems.push(I.field('التفصيل', W.detail.node));
          }
          var qtyRow = null;
          if (rule.qty) {
            W.qty = h('input', { type: 'text', inputmode: 'decimal', placeholder: 'الكمية', value: V.qty === '' ? '' : String(V.qty) });
            W.qty.addEventListener('input', autoAmount);
            W.unit = U.chips(strItems(o.lists.unite), V.unit, function (u) { V.unit = u; }, true);
            W.price = U.moneyField(V.price); W.price.input.required = false;
            W.price.input.addEventListener('input', autoAmount);
            qtyRow = h('div', { class: 'qtyblock' }, [
              h('div', { class: 'pair' }, [I.field('الكمية', W.qty), I.field('سعر الوحدة', W.price.node)]),
              h('div', { class: 'inl' }, [h('span', { class: 'lbl', text: 'الوحدة' }), W.unit.node])
            ]);
            moreItems.push(qtyRow);
          }
          W.amount = U.moneyField(V.amount);
          W.note = h('input', { type: 'text', maxlength: '300', placeholder: 'اختياري', value: V.note });
          W.sbon = h('input', { type: 'text', maxlength: '40', placeholder: 'اختياري — رقم وصل المورد إن وُجد', value: V.sbon });

          panel.appendChild(h('div', { class: 'ph' }, [h('h4', { text: 'مصروف جديد' }), kname, W.kind.node]));
          if (!isAdmin && S.balance !== null) panel.appendChild(h('div', { class: 'balmini' }, ['رصيد صندوقي: ', h('b', { class: S.balance < 0 ? 'neg' : '', text: money(S.balance) + ' DA' })]));
          var fq = frequent();
          if (fq.length) {
            panel.appendChild(h('div', { class: 'quick' }, [h('span', { class: 'muted', text: 'شائعة:' })].concat(fq.map(function (c) {
              return h('button', { type: 'button', class: 'pill', text: [c.article, c.tiers].filter(Boolean).join(' · '), onclick: function () { useFrequent(c); } });
            }))));
          }
          var gridEl = h('div', { class: 'form-grid' }, grid);
          var amountEl = h('div', { class: 'form-grid amountrow' }, [I.field('المبلغ (DA) *', W.amount.node)]);
          // الترتيب: التاريخ · المشروع · المرحلة · المورد · الوصل (تلقائي) · [تفاصيل مخفية] · المبلغ · نوع الأشغال · ملاحظة
          var extra = h('div', { class: 'extra' }, [
            h('div', { class: 'inl' }, [h('span', { class: 'lbl', text: 'نوع الأشغال' }), W.work.node, h('small', { class: 'muted', text: 'عادي: ضمن العقد · إضافي: خارج العقد (بطلب الزبون)' })]),
            I.field('ملاحظة (اختياري)', W.note)
          ]);
          var rcpt = h('small', { class: 'muted rcpt', text: '🧾 رقم الوصل يُنشأ تلقائيًا عند الحفظ' });
          var moreBox = h('div', { class: 'morebox', hidden: !(V.more || V.article || V.detail || V.qty || V.unit || V.price) }, moreItems);
          var moreBtn = h('button', { type: 'button', class: 'btn btn-ghost btn-sm morebtn', text: moreBox.hidden ? '＋ تفاصيل المادة (اختياري)' : '－ إخفاء التفاصيل', onclick: function () {
            moreBox.hidden = !moreBox.hidden; V.more = !moreBox.hidden;
            moreBtn.textContent = moreBox.hidden ? '＋ تفاصيل المادة (اختياري)' : '－ إخفاء التفاصيل';
            if (!moreBox.hidden) { var f = moreBox.querySelector('input'); if (f) f.focus(); }
          } });
          var fieldsEl = h('div', { class: 'fgroup' }, [hdr, gridEl, rcpt, I.field('وصل المورد (اختياري)', W.sbon), moreItems.length ? moreBtn : null, moreItems.length ? moreBox : null, amountEl, extra]);
          panel.appendChild(fieldsEl);
          panel.appendChild(h('div', { class: 'toolbar' }, [
            W.save = h('button', { type: 'button', class: 'btn btn-primary btn-big', text: 'حفظ المصروف', onclick: submit })
          ]));
          panel.appendChild(statusNode);
          U.enterNext(fieldsEl, function (e) { if (e && e.target === W.amount.input) submit(); else W.amount.input.focus(); });
          panel.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); submit(); }
          });
          autoAmount();
        }

        // عند اختيار المادة: نملأ الوحدة والسعر من آخر مرة اشتريتها (إن كانت الخانات فارغة)
        function prefill(article) {
          var rule = S.opts.rules[V.kind];
          if (!rule.qty || !article || !W.qty) return;
          if ((W.unit && W.unit.get()) || (W.price && W.price.get())) return;
          var hit = null;
          qItems().slice().reverse().some(function (q) { var l = q.line; if (l.article === article && l.unit_price > 0) { hit = l; return true; } return false; });
          if (!hit) S.items.some(function (c) { if (c.article === article && Number(c.unit_price) > 0 && c.active) { hit = c; return true; } return false; });
          if (!hit) return;
          if (hit.unit) W.unit.set(hit.unit);

        var barBox = h('div', {});
        area.appendChild(barBox);
        area.appendChild(h('div', { class: 'toolbar' }, [
          count, h('span', { class: 'spacer' }),
          h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'طباعة / PDF', onclick: function () {
            var rows = visible();
            U.printList({ title: 'سجل الدفعات', filters: fb ? fb.describe() : '', cols: ['رقم الوصل', 'التاريخ', 'الزبون', 'المشروع', 'المبلغ', 'الطريقة'],
              rows: rows.map(function (v) { return [v.id + (v.active ? '' : ' (ملغى)'), v.op_date, v.client_name, v.project_name, { t: money(v.amount), num: true }, v.method_label]; }),
              total: rows.reduce(function (a, v) { return a + (v.active ? Number(v.amount) || 0 : 0); }, 0), totalLabel: 'مجموع الدفعات السارية', signs: ['أُعدّ بواسطة', 'المدير العام'] });
          } }),
          h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'تصدير Excel', onclick: function () {
            var rows = visible();
            U.exportCsv('الدفعات', ['رقم الوصل', 'التاريخ', 'الزبون', 'المشروع', 'المبلغ', 'الطريقة', 'الحالة'],
              rows.map(function (v) { return [v.id, v.op_date, v.client_name, v.project_name, v.amount, v.method_label, v.active ? 'ساري' : 'ملغى: ' + v.void_reason]; }));
          } }),
          h('button', { class: 'btn btn-primary', type: 'button', text: '+ دفعة جديدة', onclick: openNew })
        ]));
        area.appendChild(wrapTable(['رقم الوصل', 'التاريخ', 'المشروع', 'المبلغ', 'الطريقة', 'الحالة', ''], tb));
        Promise.all([I.rpc('versements.list'), I.rpc('projects.list')]).then(function (r) {
          state.items = r[0]; state.projects = r[1].filter(function (p) { return p.active; }); buildBar(); draw();
        }).catch(fail);
      }

      /* ---------- التحويلات ---------- */
      function tabTransfers() {
        var state = { items: [], engineers: [] };
        var tb = h('tbody', {});

        function replace(t) {
          state.items = state.items.map(function (x) { return x.id === t.id ? t : x; }); draw();
          if (t.central_balance !== undefined && t.central_balance < 0) I.toast('تنبيه: رصيد الخزينة المركزية أصبح سالبًا', 'error', 6000);
        }
        function askReason(title, label, fn) {
          var reason = h('input', { type: 'text', maxlength: '200', required: true });
          I.modal({ title: title, content: formCard([I.field(label, reason)]), onSubmit: function () { return fn(reason.value); } });
        }
        function act(action, payload, msg) {
          I.rpc(action, payload).then(function (t) { replace(t); I.toast(msg); }).catch(fail);
        }

        function printTransfer(t) {
          U.print({
            title: 'أمر تحويل إلى صندوق مهندس', ref: t.id, date: t.op_date,
            rows: [['المهندس المستلم', t.engineer_name], ['الحالة', t.status_label], ['طلبه', t.requested_by], ['اعتمده', t.decided_by]],
            amount: t.amount, amountLabel: 'المبلغ المحوَّل', note: t.note,
            signs: ['المدير العام', 'المهندس المستلم']
          });
        }

        function openNew() {
          var eng = isAdmin ? U.combo(state.engineers.map(function (e) { return { id: e.id, label: e.name }; }), { placeholder: 'اختر المهندس...' }) : null;
          var date = U.dateField();
          var amount = U.moneyField();
          var note = h('input', { type: 'text', maxlength: '300', placeholder: isAdmin ? 'اختياري' : 'سبب الطلب (اختياري)' });
          var fields = [];
          if (isAdmin) fields.push(I.field('المهندس *', eng.node));
          fields.push(I.field('التاريخ', date.node), I.field('المبلغ (DA) *', amount.node), I.field('ملاحظة', note));
          I.modal({
            title: isAdmin ? 'تحويل إلى مهندس' : 'طلب مبلغ من الخزينة',
            content: formCard(fields),
            onSubmit: function () {
              if (isAdmin && !eng.get()) throw new Error('اختر المهندس');
              var a = amount.get(); if (!(a > 0)) throw new Error('أدخل المبلغ');
              return I.rpc('transfers.create', { engineer_id: eng ? eng.get() : '', op_date: date.get(), amount: a, note: note.value })
                .then(function (t) {
                  state.items.unshift(t); draw();
                  I.toast(isAdmin ? 'تم التحويل' : 'أُرسل الطلب إلى المسؤول');
                  if (t.central_balance !== undefined && t.central_balance < 0) I.toast('تنبيه: رصيد الخزينة المركزية أصبح سالبًا', 'error', 6000);
                });
            }
          });
        }

        var F = FST.transfers, fb = null;
        function visible() {
          return state.items.filter(function (t) {
            if (F.status && t.status !== F.status) return false;
            if (F.eng && t.engineer_name !== F.eng) return false;
            if (!U.inRange(t.op_date, F.from, F.to)) return false;
            var q = U.norm((F.q || '').trim());
            return !q || U.norm(t.id + ' ' + t.engineer_name + ' ' + (t.note || '')).indexOf(q) >= 0;
          });
        }
        function draw() {
          var vis = visible();
          var tot = vis.reduce(function (a, t) { return a + (t.status === 'APPROVED' ? Number(t.amount) || 0 : 0); }, 0);
          count.textContent = vis.length + ' تحويلًا — المعتمد ' + money(tot);
          tb.textContent = '';
          if (!vis.length) tb.appendChild(h('tr', {}, [h('td', { colspan: '7', class: 'empty', text: 'لا توجد تحويلات' })]));
          vis.forEach(function (t) {
            var acts = [];
            if (t.status === 'PENDING') {
              if (isAdmin) {
                acts.push(h('button', { type: 'button', class: 'btn btn-primary btn-sm', text: 'اعتماد', onclick: function () { act('transfers.decide', { id: t.id, approve: true }, 'تم الاعتماد'); } }));
                acts.push(h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'رفض', onclick: function () {
                  askReason('رفض الطلب ' + t.id, 'سبب الرفض *', function (r) {
                    return I.rpc('transfers.decide', { id: t.id, approve: false, reason: r }).then(function (u) { replace(u); I.toast('تم الرفض'); });
                  });
                } }));
              }
              acts.push(h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'سحب', onclick: function () { act('transfers.cancel', { id: t.id }, 'تم سحب الطلب'); } }));
            } else if (t.status === 'APPROVED' && isAdmin) {
              acts.push(h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'إلغاء', onclick: function () {
                askReason('إلغاء التحويل ' + t.id, 'سبب الإلغاء *', function (r) {
                  return I.rpc('transfers.void', { id: t.id, reason: r }).then(function (u) { replace(u); I.toast('أُلغي التحويل'); });
                });
              } }));
            } else if (t.reason) {
              acts.push(h('small', { class: 'muted', text: t.reason }));
            }
            if (t.status === 'APPROVED' || t.status === 'PENDING') {
              acts.push(h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'طباعة', onclick: function () { printTransfer(t); } }));
            }
            tb.appendChild(h('tr', { class: (t.status === 'APPROVED' || t.status === 'PENDING') ? '' : 'off' }, [
              h('td', { text: t.id }), h('td', { text: t.op_date }), h('td', { text: t.engineer_name }), h('td', { text: money(t.amount) }),
              h('td', {}, [h('span', { class: 'badge ' + (STATUS_CLASS[t.status] || ''), text: t.status_label })]),
              h('td', { text: t.note }), h('td', { class: 'actions' }, acts)
            ]));
          });
        }

        var count = h('span', { class: 'muted' });
        var barBox = h('div', {});
        function buildBar() {
          var statusOpts = [];
          var seen = {};
          state.items.forEach(function (t) { if (!seen[t.status]) { seen[t.status] = 1; statusOpts.push({ id: t.status, label: t.status_label }); } });
          var defs = [
            { key: 'q', type: 'search', label: 'بحث', placeholder: 'الرقم أو الملاحظة...' },
            { key: 'status', type: 'select', label: 'الحالة', all: 'كل الحالات', options: statusOpts }
          ];
          if (isAdmin) defs.push({ key: 'eng', type: 'select', label: 'المهندس', all: 'كل المهندسين', options: U.uniq(state.items, function (t) { return t.engineer_name; }) });
          defs.push({ key: 'from', type: 'date', label: 'من تاريخ' }, { key: 'to', type: 'date', label: 'إلى تاريخ' });
          fb = U.filterBar(defs, F, draw);
          barBox.textContent = ''; barBox.appendChild(fb.node);
        }
        area.appendChild(barBox);
        area.appendChild(h('div', { class: 'toolbar' }, [
          count, h('span', { class: 'spacer' }),
          h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'طباعة / PDF', onclick: function () {
            var rows = visible();
            U.printList({ title: isAdmin ? 'سجل التحويلات' : 'سجل طلبات المبالغ', filters: fb ? fb.describe() : '', cols: ['الرقم', 'التاريخ', 'المهندس', 'المبلغ', 'الحالة', 'ملاحظة'],
              rows: rows.map(function (t) { return [t.id, t.op_date, t.engineer_name, { t: money(t.amount), num: true }, t.status_label, t.note || '']; }),
              total: rows.reduce(function (a, t) { return a + (t.status === 'APPROVED' ? Number(t.amount) || 0 : 0); }, 0), totalLabel: 'مجموع التحويلات المعتمدة', signs: ['أُعدّ بواسطة', 'المدير العام'] });
          } }),
          h('button', { class: 'btn btn-primary', type: 'button', text: isAdmin ? '+ تحويل إلى مهندس' : '+ طلب مبلغ', onclick: openNew })
        ]));
        area.appendChild(wrapTable(['الرقم', 'التاريخ', 'المهندس', 'المبلغ', 'الحالة', 'ملاحظة', ''], tb));
        var jobs = [I.rpc('transfers.list')];
        if (isAdmin) jobs.push(I.rpc('projects.options'));
        Promise.all(jobs).then(function (r) {
          state.items = r[0]; if (r[1]) state.engineers = r[1].engineers; buildBar(); draw();
        }).catch(fail);
      }

      drawTabs();
      load();
    }
  });
})();
</script>

<script>
(function () {
  'use strict';
  var I = window.INOURAR, h = I.h, U = I.ui;

  I.register('audit', {
    title: 'سجل النشاط',
    render: function (body) {
      var S = { items: [] };
      var F = {}, fb = null;
      var tb = h('tbody', {});
      var count = h('span', { class: 'muted' });
      var barBox = h('div', {});
      function visible() {
        var q = U.norm((F.q || '').trim());
        return S.items.filter(function (r) {
          if (F.user && r.user !== F.user) return false;
          if (F.action && r.action !== F.action) return false;
          if (!U.inRange(r.ts.slice(0, 10), F.from, F.to)) return false;
          return !q || U.norm(r.user + ' ' + r.label + ' ' + r.entity_id + ' ' + r.entity).indexOf(q) >= 0;
        });
      }
      function draw() {
        var rows = visible();
        count.textContent = rows.length + ' حدثًا';
        tb.textContent = '';
        if (!rows.length) tb.appendChild(h('tr', {}, [h('td', { colspan: '4', class: 'empty', text: 'لا توجد أحداث' })]));
        rows.forEach(function (r) {
          tb.appendChild(h('tr', {}, [h('td', { text: r.ts }), h('td', { text: r.user }), h('td', { text: r.label }), h('td', { text: r.entity_id })]));
        });
      }
      function buildBar() {
        if (fb) return;
        var acts = []; var seen = {};
        S.items.forEach(function (r) { if (!seen[r.action]) { seen[r.action] = 1; acts.push({ id: r.action, label: r.label }); } });
        fb = U.filterBar([
          { key: 'q', type: 'search', label: 'بحث' },
          { key: 'user', type: 'select', label: 'المستخدم', all: 'كل المستخدمين', options: U.uniq(S.items, function (r) { return r.user; }) },
          { key: 'action', type: 'select', label: 'الحدث', all: 'كل الأحداث', options: acts },
          { key: 'from', type: 'date', label: 'من تاريخ' }, { key: 'to', type: 'date', label: 'إلى تاريخ' }
        ], F, draw);
        barBox.appendChild(fb.node);
      }
      body.appendChild(h('p', { class: 'muted', text: 'آخر 200 حدث في المنصة: من فعل ماذا ومتى. للقراءة فقط.' }));
      body.appendChild(barBox);
      body.appendChild(h('div', { class: 'toolbar' }, [
        count, h('span', { class: 'spacer' }),
        h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'طباعة / PDF', onclick: function () {
          var rows = visible();
          U.printList({ title: 'سجل النشاط', filters: fb ? fb.describe() : '', cols: ['الوقت', 'المستخدم', 'الحدث', 'المرجع'], rows: rows.map(function (r) { return [r.ts, r.user, r.label, r.entity_id]; }), signs: ['أُعدّ بواسطة', 'المدير العام'] });
        } })
      ]));
      body.appendChild(h('div', { class: 'table-wrap' }, [h('table', {}, [
        h('thead', {}, [h('tr', {}, ['الوقت', 'المستخدم', 'الحدث', 'المرجع'].map(function (t) { return h('th', { text: t }); }))]), tb
      ])]));
      I.refresher(function () { load(); });
      function load() { I.rpc('audit.list', { limit: 200 }).then(function (r) { S.items = r; buildBar(); draw(); }).catch(function (e) { I.toast(e.message || 'حدث خطأ', 'error'); }); }
      load();
    }
  });
})();
</script>

<script>
(function () {
  'use strict';
  var I = window.INOURAR, h = I.h;

  var GUIDES = {
    admin: {
      label: 'المدير والمسؤول',
      steps: [
        ['clients', 'إضافة زبون', 'من قسم «الزبائن» اضغط «+ زبون جديد»، واختر «زبون» أو «شركة»، واكتب الاسم واللقب بالأحرف اللاتينية ورقم الواتساب (إلزامي). الزبون يظهر بعدها في قائمة اختيار المشاريع.'],
        ['projects', 'إنشاء مشروع', 'من قسم «المشاريع» اضغط «+ مشروع جديد»، اختر الزبون والبلدية من القائمة (أو «أخرى») وعيّن المهندس المسؤول.'],
        ['caisses', 'تسجيل دفعة من الزبون', 'من «الصناديق والخزينة» ثم تبويب «الدفعات» اضغط «+ دفعة جديدة». يُنشأ وصل استلام يمكن طباعته بزر «طباعة».'],
        ['caisses', 'تمويل صندوق مهندس', 'من تبويب «الصناديق» اضغط «تحويل» بجانب المهندس واكتب المبلغ. أو راجع «التحويلات» واضغط «اعتماد» أو «رفض» على طلبات المهندسين.'],
        ['finance', 'متابعة المصاريف', 'تبويب «المصاريف» يعرض كل ما صرفه المهندسون. الإلغاء لا يحذف شيئًا؛ يبقى في السجل مع السبب.'],
        ['personnel', 'الحسابات والصلاحيات', 'من «الموظفون والصلاحيات» اضغط «+ حساب جديد». لا يُحذف أي حساب؛ يُعطَّل فقط.'],
        ['settings', 'القوائم', 'من «الإعدادات» عدّل القوائم المستعملة في النماذج (البلديات، أنواع المصاريف...). العنصر المعطَّل يختفي من الاختيارات وتبقى العمليات القديمة سليمة.']
      ],
      faq: [
        ['كيف يُحسب رصيد الصندوق؟', 'دائمًا من السجلات: ما استلمه الصندوق بتحويلات معتمدة ناقص ما صُرف منه. لا يوجد رقم يُدخَل يدويًا.'],
        ['لماذا لا يوجد زر حذف؟', 'حفاظًا على سلامة الحسابات: كل عملية تُلغى بسبب مكتوب وتبقى ظاهرة في السجل.'],
        ['كيف أحفظ كشف حساب PDF؟', 'اضغط «طباعة» ثم اختر «حفظ كـ PDF» في نافذة الطباعة.']
      ]
    },
    eng: {
      label: 'المهندس',
      steps: [
        ['projects', 'مشاريعي', 'قسم «المشاريع» يعرض المشاريع المسندة إليك فقط. اضغط «فتح» لرؤية المصاريف وتوزيعها وتقدم المرحلة.'],
        ['caisses', 'طلب مبلغ', 'من «الصناديق والخزينة» تبويب «صندوقي» اضغط «+ طلب مبلغ». يصلك المبلغ في صندوقك بعد اعتماد الإدارة.'],
        ['finance', 'تسجيل مصروف', 'من تبويب «المصاريف»: اختر النوع (الأيقونة) ثم التاريخ والمشروع والمرحلة (إلزامية) والمورد، وأدخل المبلغ، واضغط «حفظ المصروف». رقم الوصل يُنشأ تلقائيًا. إن أردت تسجيل المادة والكمية والسعر اضغط «＋ تفاصيل المادة (اختياري)». يظهر السطر فورًا في «أسطر هذه الجلسة» ويُحفظ في الخلفية، فواصل بالسطر التالي دون انتظار. إن لم تجد المورد أو المادة في القائمة اكتبه واختر «+ إضافة». الأسطر التي لم تُحفظ بسبب انقطاع الشبكة تبقى في هاتفك وتُرسل تلقائيًا. لكل مصروف رقم وصل تلقائي، ويمكنك كتابة «وصل المورد» إن وُجد. وعند قبول المكتب لطلب مبلغ يظهر لك إشعار في الشاشة الرئيسية: اضغط «تأكيد الاستلام».'],
        ['clock', 'متابعة الطلبات', 'تبويب «طلبات المبالغ» يعرض حالة كل طلب: بالانتظار أو معتمد أو مرفوض.'],
        ['guide', 'كشف حسابي', 'في تبويب «صندوقي» اضغط «طباعة / PDF» للحصول على كشف بحركات صندوقك بشعار المكتب.']
      ],
      faq: [
        ['صرفت أكثر من رصيدي، ماذا يحدث؟', 'يظهر الرصيد بالسالب بين قوسين وتصل الإدارة تنبيهًا. اطلب مبلغًا لتغطيته.'],
        ['أخطأت في مصروف', 'من «سجل المصاريف» ألغِ المصروف مع ذكر السبب، ثم أدخله صحيحًا. المبلغ يعود إلى صندوقك.']
      ]
    },
    client: {
      label: 'الزبون',
      steps: [
        ['portal', 'مشاريعي ودفعاتي', 'ستظهر هنا مشاريعك ودفعاتك وأوصال الاستلام عند تفعيل بوابة الزبون.'],
        ['guide', 'للاستفسار', 'تواصل مع مكتب الدراسات مباشرة لأي سؤال عن مشروعك.']
      ],
      faq: []
    }
  };

  var TIPS = 'اضغط Ctrl + K للبحث السريع عن أي قسم أو مشروع، وزر القمر/الشمس في الأعلى يبدّل الوضع الداكن.';

  function pick(role) { return role === 'ING' ? 'eng' : role === 'CLIENT' ? 'client' : 'admin'; }

  I.register('guide', {
    title: 'دليل الاستعمال',
    render: function (body) {
      var g = GUIDES[pick(I.user().role)];
      body.appendChild(h('p', { class: 'muted', text: 'خطوات سريعة حسب دورك: ' + g.label }));
      var area = h('div', {});
      area.appendChild(h('div', { class: 'guide-grid' }, g.steps.map(function (s, i) {
        return h('div', { class: 'guide-step', style: 'animation-delay:' + (i * 0.05) + 's' }, [
          h('span', { class: 'guide-ic' }, [I.icon(s[0], 22)]),
          h('div', {}, [h('h4', {}, [h('i', { text: String(i + 1) }), s[1]]), h('p', { text: s[2] })])
        ]);
      })));
      area.appendChild(h('div', { class: 'guide-tip' }, [h('b', { text: 'نصيحة' }), TIPS]));
      if (g.faq.length) {
        area.appendChild(h('div', { class: 'guide-faq' }, g.faq.map(function (q) {
          return h('details', {}, [h('summary', { text: q[0] }), h('p', { text: q[1] })]);
        })));
      }
      body.appendChild(area);
    }
  });
})();
</script>
